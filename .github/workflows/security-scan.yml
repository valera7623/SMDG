name: Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  # SECURITY_SCAN_MODE drives CI blocking vs advisory scanners:
  #
  # - audit (scheduled nightly): scanners run for telemetry only — jobs use continue-on-error where set so the workflow completes green while uploading artifacts.
  #
  # - balanced (default for push / PR): BLOCKS on leaked secrets (Gitleaks, TruffleHog), container scanners per thresholds below (Trivy / Grype), API security tests, DAST jobs when enabled.
  #   Bandit, Semgrep, and Safety are NON-BLOCKING here — noisy SAST/SCA stays visible in SARIF/HTML summaries without failing merges.
  #   Final consolidated gate (security-report job): fails if summary JSON shows CRITICAL-class rollup or Gitleaks findings. Optional repo/org variable
  #   SECURITY_GATE_BALANCED_FAIL_TRIVY_HIGH=true also fails on Trivy HIGH in the summary (align with stricter image policy).
  #
  # - strict (repository variable SECURITY_SCAN_MODE=strict): blocks on Bandit, Semgrep, Safety failures as well — use before releases / sensitive merges.
  #   Consolidated gate: fails if any rollup severity > 0, or Safety/Gitleaks counts > 0 (see scripts/security_gate.py).
  SECURITY_SCAN_MODE: ${{ github.event_name == 'schedule' && 'audit' || (vars.SECURITY_SCAN_MODE == 'strict' && 'strict' || 'balanced') }}

jobs:
  sast-bandit:
    runs-on: ubuntu-latest
    continue-on-error: ${{ env.SECURITY_SCAN_MODE != 'strict' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Bandit
        run: pip install bandit
      - name: Run Bandit
        run: bandit -c .bandit.yaml -r app/ -f json -o bandit-report.json
      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  sast-semgrep:
    runs-on: ubuntu-latest
    continue-on-error: ${{ env.SECURITY_SCAN_MODE != 'strict' }}
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: .semgrep.yml
          generateSarif: "1"
      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
      - name: Save Semgrep JSON report
        run: semgrep --config .semgrep.yml --json --output semgrep-report.json
      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json

  sast-sonarqube:
    runs-on: ubuntu-latest
    if: ${{ secrets.SONAR_TOKEN != '' && secrets.SONAR_HOST_URL != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  sca-safety:
    runs-on: ubuntu-latest
    continue-on-error: ${{ env.SECURITY_SCAN_MODE != 'strict' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install poetry safety
          poetry export -f requirements.txt --output requirements.txt --without-hashes
      - name: Run Safety
        run: safety check -r requirements.txt --json > safety-report.json
      - name: Upload Safety report
        uses: actions/upload-artifact@v4
        with:
          name: safety-report
          path: safety-report.json

  sca-snyk:
    runs-on: ubuntu-latest
    if: ${{ secrets.SNYK_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Run Snyk
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --all-projects --sarif-file-output=snyk-report.sarif
      - name: Upload Snyk report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-report
          path: snyk-report.sarif

  sca-snyk-container:
    runs-on: ubuntu-latest
    if: ${{ secrets.SNYK_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t smdg:latest .
      - name: Run Snyk container scan
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: smdg:latest
          args: --file=Dockerfile --sarif-file-output=snyk-container-report.sarif
      - name: Upload Snyk container report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-container-report
          path: snyk-container-report.sarif

  secrets-gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        continue-on-error: ${{ env.SECURITY_SCAN_MODE == 'audit' }}
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect \
            --source /repo \
            --config /repo/.gitleaks.toml \
            --no-git \
            --report-format json \
            --report-path /repo/gitleaks-report.json
      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  secrets-trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run TruffleHog
        continue-on-error: ${{ env.SECURITY_SCAN_MODE == 'audit' }}
        run: |
          docker run --rm -v "$PWD:/pwd" trufflesecurity/trufflehog:latest filesystem /pwd \
            --json > trufflehog-report.json
      - name: Upload TruffleHog report
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-report
          path: trufflehog-report.json

  container-trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t smdg:latest .
      # Balanced/strict: non-zero exit if findings at or above Trivy severity filter; audit always 0.
      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@master
        continue-on-error: ${{ env.SECURITY_SCAN_MODE == 'audit' }}
        with:
          image-ref: smdg:latest
          format: sarif
          output: trivy-report.sarif
          # strict: report HIGH+CRITICAL; balanced: only CRITICAL (reduces false-red on unfixed upstream HIGH)
          severity: ${{ env.SECURITY_SCAN_MODE == 'strict' && 'HIGH,CRITICAL' || 'CRITICAL' }}
          exit-code: ${{ env.SECURITY_SCAN_MODE == 'audit' && '0' || '1' }}
          ignore-unfixed: ${{ env.SECURITY_SCAN_MODE == 'strict' && 'false' || 'true' }}
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-report.sarif
      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.sarif

  container-grype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t smdg:latest .
      - name: Run Grype scanner
        uses: anchore/scan-action@v3
        continue-on-error: ${{ env.SECURITY_SCAN_MODE == 'audit' }}
        with:
          image: smdg:latest
          fail-build: ${{ env.SECURITY_SCAN_MODE == 'audit' && 'false' || 'true' }}
          severity-cutoff: ${{ env.SECURITY_SCAN_MODE == 'strict' && 'medium' || 'high' }}
          output-format: json
          output-file: grype-report.json
      - name: Upload Grype report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grype-report
          path: grype-report.json

  dast-zap:
    runs-on: ubuntu-latest
    needs: [sast-bandit, sast-semgrep]
    steps:
      - uses: actions/checkout@v4
      - name: Start SMDG
        run: docker compose up -d
      - name: Wait for services
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Run ZAP scan
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          target: http://localhost:8000
          cmd_options: "-a -j -m 3 -r zap-report.html"
      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: report_html.html
      - name: Stop SMDG
        if: always()
        run: docker compose down -v

  dast-nuclei:
    runs-on: ubuntu-latest
    needs: [sast-bandit, sast-semgrep]
    steps:
      - uses: actions/checkout@v4
      - name: Start SMDG
        run: docker compose up -d
      - name: Run Nuclei
        uses: projectdiscovery/nuclei-action@main
        with:
          target: http://localhost:8000
          templates: cves,misconfiguration,exposures
          json: true
          output: nuclei-report.json
      - name: Upload Nuclei report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nuclei-report
          path: nuclei-report.json
      - name: Stop SMDG
        if: always()
        run: docker compose down -v

  dast-api-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: |
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-ansi
          pip install pytest pytest-httpx
      - name: Run API security tests
        run: pytest tests/security/test_api_security.py -v --junitxml=api-security-report.xml
      - name: Upload API Security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-security-report
          path: api-security-report.xml

  security-report:
    runs-on: ubuntu-latest
    needs:
      - sast-bandit
      - sast-semgrep
      - sca-safety
      - secrets-gitleaks
      - secrets-trufflehog
      - container-trivy
      - container-grype
      - dast-zap
      - dast-nuclei
      - dast-api-security
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: reports
      - name: Generate security summary
        env:
          SECURITY_SCAN_MODE: ${{ env.SECURITY_SCAN_MODE }}
        run: |
          BASELINE_ARGS=
          if [ -f reports/security-baseline/security-baseline.json ]; then
            BASELINE_ARGS="--baseline reports/security-baseline/security-baseline.json"
          elif [ -f reports/security-baseline.json ]; then
            BASELINE_ARGS="--baseline reports/security-baseline.json"
          fi
          python scripts/generate_security_report.py \
            --input reports \
            --output security-summary.html \
            --mode "${SECURITY_SCAN_MODE}" \
            --json-output security-summary.json \
            ${BASELINE_ARGS}
      - name: Consolidated security gate
        env:
          SECURITY_SCAN_MODE: ${{ env.SECURITY_SCAN_MODE }}
          SECURITY_GATE_BALANCED_FAIL_TRIVY_HIGH: ${{ vars.SECURITY_GATE_BALANCED_FAIL_TRIVY_HIGH }}
        run: python scripts/security_gate.py security-summary.json --mode "${SECURITY_SCAN_MODE}"
      - name: Upload summary report
        uses: actions/upload-artifact@v4
        with:
          name: security-summary
          path: |
            security-summary.html
            security-summary.json

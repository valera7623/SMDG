# Cursor → GitHub → Actions → VPS (простой деплой, два сервера)
#
# Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY (общий ключ на оба VPS)
#          VPS2_HOST, VPS2_USER
#          VPS_GITHUB_TOKEN (опционально, автоклон)
# Variables: VPS_COMPOSE_FILE (default docker-compose.demo.yml), VPS_DEPLOY_PATH, VPS_AUTO_CLONE, VPS2_*
#
# Справка: ../DEPLOYMENT_SECRETS.md

name: 🚀 Deploy SMDG to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: primary
            host_secret: VPS_HOST
            user_secret: VPS_USER
            path_default: /home/smdg/SMDG
            deploy_path_var: VPS_DEPLOY_PATH
            auto_clone_var: VPS_AUTO_CLONE
            health_domain: ""
          - target: fileguardian
            host_secret: VPS2_HOST
            user_secret: VPS2_USER
            path_default: /home/smdg/SMDG
            deploy_path_var: VPS2_DEPLOY_PATH
            auto_clone_var: VPS2_AUTO_CLONE
            health_domain: fileguardian.info
    env:
      DEPLOY_PATH: ${{ vars[matrix.deploy_path_var] }}
      VPS_AUTO_CLONE: ${{ vars[matrix.auto_clone_var] }}
      COMPOSE_FILE: ${{ vars.VPS_COMPOSE_FILE }}
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: ✅ Validate deploy secrets (${{ matrix.target }})
        env:
          DEPLOY_HOST: ${{ secrets[matrix.host_secret] }}
          DEPLOY_USER: ${{ secrets[matrix.user_secret] }}
        run: |
          missing=0
          if [[ -z "${{ secrets.VPS_SSH_KEY }}" ]]; then
            echo "::error::VPS_SSH_KEY is empty (required for all targets)"
            missing=1
          fi
          if [[ -z "$DEPLOY_HOST" ]]; then
            echo "::error::Secret ${{ matrix.host_secret }} is not set"
            missing=1
          fi
          if [[ -z "$DEPLOY_USER" ]]; then
            echo "::error::Secret ${{ matrix.user_secret }} is not set (обычно smdg, как VPS_USER)"
            missing=1
          fi
          if [[ "$missing" -ne 0 ]]; then exit 1; fi
          echo "Secrets OK for ${{ matrix.target }} (user length=${#DEPLOY_USER})"

      - name: 🔑 Setup SSH (${{ matrix.target }})
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets[matrix.host_secret] }}
          DEPLOY_USER: ${{ secrets[matrix.user_secret] }}
          JUMP_HOST: ${{ secrets.VPS_HOST }}
          JUMP_USER: ${{ secrets.VPS_USER }}
          MATRIX_TARGET: ${{ matrix.target }}
          VPS2_SSH_PROXY_JUMP: ${{ vars.VPS2_SSH_PROXY_JUMP }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          unset SSH_AUTH_SOCK SSH_AGENT_PID 2>/dev/null || true
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub 2>/dev/null; then
            echo "::error::VPS_SSH_KEY повреждён или неполный (ssh-keygen -y failed). Пересоздайте Secret: весь файл от BEGIN до END включительно."
            exit 1
          fi
          echo "Строка для authorized_keys (${MATRIX_TARGET}):"
          cat ~/.ssh/deploy_key.pub
          ssh-keygen -lf ~/.ssh/deploy_key

          USE_PROXY_JUMP=false
          if [[ "$MATRIX_TARGET" == "fileguardian" ]] && [[ "$VPS2_SSH_PROXY_JUMP" != "false" ]]; then
            USE_PROXY_JUMP=true
            echo "fileguardian: SSH через ProxyJump ${JUMP_USER}@${JUMP_HOST} (Variable VPS2_SSH_PROXY_JUMP=false — прямой SSH)"
            ssh-keyscan -H "$JUMP_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          fi
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          {
            if [[ "$USE_PROXY_JUMP" == true ]]; then
              echo "Host vps-jump"
              echo "  HostName ${JUMP_HOST}"
              echo "  User ${JUMP_USER}"
              echo "  IdentityFile ~/.ssh/deploy_key"
              echo "  BatchMode yes"
              echo "  IdentitiesOnly yes"
              echo "  PreferredAuthentications publickey"
              echo "  PasswordAuthentication no"
              echo "  ConnectTimeout 30"
              echo "  StrictHostKeyChecking accept-new"
            fi
            echo "Host vps-deploy"
            echo "  HostName ${DEPLOY_HOST}"
            echo "  User ${DEPLOY_USER}"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  BatchMode yes"
            echo "  IdentitiesOnly yes"
            echo "  PreferredAuthentications publickey"
            echo "  PasswordAuthentication no"
            echo "  ConnectTimeout 30"
            echo "  StrictHostKeyChecking accept-new"
            if [[ "$USE_PROXY_JUMP" == true ]]; then
              echo "  ProxyJump vps-jump"
            fi
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
          echo "USE_PROXY_JUMP=${USE_PROXY_JUMP}" >> "$GITHUB_ENV"

          if command -v timeout >/dev/null 2>&1; then
            timeout 5 bash -c "echo >/dev/tcp/${DEPLOY_HOST}/22" && echo "TCP 22 open on ${DEPLOY_HOST}" \
              || echo "::warning::TCP 22 not reachable from Actions runner (firewall? try VPS2_SSH_PROXY_JUMP=true)"
          fi

      - name: 🔌 Test SSH (${{ matrix.target }})
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets[matrix.host_secret] }}
          DEPLOY_USER: ${{ secrets[matrix.user_secret] }}
        run: |
          set -euo pipefail
          try_ssh() {
            ssh vps-deploy "$@"
          }
          if try_ssh 'echo "SSH OK on $(hostname) as $(whoami)"'; then
            exit 0
          fi
          echo "::group::ssh -vvv (last 40 lines)"
          ssh -vvv vps-deploy true 2>&1 | tail -40 || true
          echo "::endgroup::"
          echo "::error::SSH failed for ${{ matrix.target }}"
          if [[ "${USE_PROXY_JUMP:-false}" == true ]]; then
            echo "Сейчас: ProxyJump через primary (VPS_HOST). Нужен рабочий SSH на primary и ключ smdg на fileguardian."
          else
            echo "Прямой SSH. Если с ПК вход работает, а Actions нет — firewall на fileguardian режет IP GitHub."
            echo "Задайте Variable VPS2_SSH_PROXY_JUMP=true (дефолт для fileguardian) или откройте порт 22 для Actions."
          fi
          echo "Парольный SSH между VPS не подходит для Actions — нужен publickey в /home/smdg/.ssh/authorized_keys на ОБОИХ серверах (строка из Setup SSH)."
          exit 1

      - name: 🐳 Deploy to VPS (${{ matrix.target }})
        env:
          REPO_SLUG: ${{ github.repository }}
          VPS_HOST: ${{ secrets[matrix.host_secret] }}
          VPS_USER: ${{ secrets[matrix.user_secret] }}
          PATH_DEFAULT: ${{ matrix.path_default }}
        run: |
          export DEPLOY_PATH="${DEPLOY_PATH:-$PATH_DEFAULT}"
          export COMPOSE_FILE="${COMPOSE_FILE:-docker-compose.demo.yml}"
          export REPO_URL="https://github.com/${REPO_SLUG}.git"
          export VPS_AUTO_CLONE="${VPS_AUTO_CLONE:-false}"
          echo "▶ Target: ${{ matrix.target }} → ${VPS_USER}@${VPS_HOST}:${DEPLOY_PATH} (compose: ${COMPOSE_FILE})"
          ssh vps-deploy \
            env DEPLOY_PATH="$DEPLOY_PATH" \
                COMPOSE_FILE="$COMPOSE_FILE" \
                REPO_URL="$REPO_URL" \
                REPO_SLUG="$REPO_SLUG" \
                VPS_AUTO_CLONE="$VPS_AUTO_CLONE" \
                VPS_GIT_CLONE_TOKEN="${{ secrets.VPS_GITHUB_TOKEN }}" \
            bash -s << 'REMOTE'
          set -euo pipefail

          if [[ ! -d "$DEPLOY_PATH" ]]; then
            if [[ "${VPS_AUTO_CLONE:-false}" == "true" ]]; then
              echo "📂 DEPLOY_PATH отсутствует — клонируем репозиторий (VPS_AUTO_CLONE=true)..."
              mkdir -p "$(dirname "$DEPLOY_PATH")"
              if [[ -n "${VPS_GIT_CLONE_TOKEN:-}" ]]; then
                git clone "https://x-access-token:${VPS_GIT_CLONE_TOKEN}@github.com/${REPO_SLUG}.git" "$DEPLOY_PATH"
              else
                git clone "$REPO_URL" "$DEPLOY_PATH"
              fi
            else
              echo "::error::Каталог деплоя не существует на VPS: $DEPLOY_PATH"
              echo ""
              echo "Сделайте один из вариантов:"
              echo "  1) На сервере: mkdir -p \"$(dirname "$DEPLOY_PATH")\" && git clone $REPO_URL \"$DEPLOY_PATH\""
              echo "     (для приватного репозитория используйте deploy key или PAT при clone)"
              echo "  2) Либо задайте VPS_DEPLOY_PATH / VPS2_DEPLOY_PATH в GitHub Variables."
              echo "  3) Либо VPS_AUTO_CLONE / VPS2_AUTO_CLONE=true (и при необходимости VPS_GITHUB_TOKEN)."
              exit 1
            fi
          fi

          cd "$DEPLOY_PATH"
          COMPOSE_FILE="${COMPOSE_FILE:-docker-compose.demo.yml}"
          if [[ ! -f "$COMPOSE_FILE" ]]; then
            echo "::error::Compose file not found: $DEPLOY_PATH/$COMPOSE_FILE"
            exit 1
          fi
          if [[ "$COMPOSE_FILE" == *demo* ]] && [[ ! -f .env ]]; then
            echo "::error::Для demo нужен .env на сервере: cp .env.demo.example .env && задайте DOMAIN, JWT_SECRET_KEY, POSTGRES_PASSWORD"
            exit 1
          fi

          echo "🛑 Stopping containers (compose: $COMPOSE_FILE)..."
          docker compose -f docker-compose.yml down 2>/dev/null || true
          docker compose -f docker-compose.demo.yml down 2>/dev/null || true
          docker compose -f "$COMPOSE_FILE" down 2>/dev/null || true

          echo "🔧 Preparing host dirs (static, certbot)..."
          mkdir -p static certbot/www certs
          docker run --pull=missing --rm -v "$(pwd):/w" alpine:3.20 \
            sh -c "chown -R $(id -u):$(id -g) /w/static /w/certbot 2>/dev/null || true"

          echo "📥 Pulling latest changes from Git..."
          git fetch origin main
          git reset --hard origin/main
          echo "🐳 Preparing clean Docker build context..."
          BUILD_CONTEXT="$(mktemp -d /tmp/smdg-build-context.XXXXXX)"
          COMPOSE_BUILD_OVERRIDE="$(mktemp /tmp/smdg-compose-build.XXXXXX.yml)"
          cleanup_build_context() {
            rm -rf "$BUILD_CONTEXT" "$COMPOSE_BUILD_OVERRIDE"
          }
          trap cleanup_build_context EXIT

          tar \
            --exclude='./.git' \
            --exclude='./certbot' \
            --exclude='./certbot/**' \
            --exclude='./certs' \
            --exclude='./certs/**' \
            --exclude='./secrets' \
            --exclude='./secrets/**' \
            --exclude='./keys' \
            --exclude='./keys/**' \
            --exclude='./uploads' \
            --exclude='./uploads/**' \
            --exclude='./encrypted' \
            --exclude='./encrypted/**' \
            --exclude='./decrypted' \
            --exclude='./decrypted/**' \
            --exclude='./audit_logs' \
            --exclude='./audit_logs/**' \
            --exclude='./backups' \
            --exclude='./backups/**' \
            -cf - . | tar -xf - -C "$BUILD_CONTEXT"

          cat > "$COMPOSE_BUILD_OVERRIDE" <<EOF
          services:
            smdg:
              image: smdg-smdg:latest
              build:
                context: "$BUILD_CONTEXT"
                dockerfile: Dockerfile
          EOF

          echo "🐳 Rebuilding and restarting: docker compose -f $COMPOSE_FILE ..."
          docker compose -f "$COMPOSE_FILE" -f "$COMPOSE_BUILD_OVERRIDE" up -d --build
          echo "✅ Deployment complete ($COMPOSE_FILE)"
          REMOTE

      - name: 🩺 Smoke test (${{ matrix.target }})
        if: matrix.health_domain != '' && vars.VPS2_SKIP_SMOKE_TEST != 'true'
        shell: bash
        env:
          HEALTH_DOMAIN: ${{ vars.VPS2_DOMAIN != '' && vars.VPS2_DOMAIN || matrix.health_domain }}
          PATH_DEFAULT: ${{ matrix.path_default }}
          COMPOSE_FILE: ${{ vars.VPS_COMPOSE_FILE }}
        run: |
          set -euo pipefail
          URL="https://${HEALTH_DOMAIN}/health/ready"
          echo "Проверка ${URL} (502/503 — приложение ещё поднимается после docker compose up, ждём до ~4 мин)"

          for i in $(seq 1 40); do
            code="$(curl -sS -o /tmp/smoke-body.txt -w "%{http_code}" --max-time 15 "$URL" || echo "000")"
            if [[ "$code" == "200" ]]; then
              echo "✅ ${URL} → HTTP 200"
              head -c 500 /tmp/smoke-body.txt || true
              exit 0
            fi
            echo "attempt ${i}/40: HTTP ${code} ($( [[ "$code" == "502" ]] && echo 'nginx: бэкенд smdg недоступен' || [[ "$code" == "503" ]] && echo 'приложение живо, не ready' || echo 'сеть/DNS/TLS' ))"
            sleep 6
          done

          echo "::group::Диагностика на сервере (docker + локальный health)"
          COMPOSE_FILE="${COMPOSE_FILE:-docker-compose.demo.yml}"
          ssh vps-deploy "set -e; cd \"${DEPLOY_PATH:-$PATH_DEFAULT}\"; docker compose -f \"${COMPOSE_FILE}\" ps; echo '---'; docker compose -f \"${COMPOSE_FILE}\" logs smdg --tail 40; echo '---'; curl -sS -w '\nHTTP %{http_code}\n' --max-time 10 http://127.0.0.1:8000/health/live || true; curl -sS -w '\nHTTP %{http_code}\n' --max-time 10 http://127.0.0.1:8000/health/ready || true" \
            || echo "SSH diagnostics skipped"
          echo "::endgroup::"
          echo "::error::Health check failed: ${URL} (последний HTTP ${code}). 502 = nginx не видит smdg:8000 — смотрите logs выше."
          exit 1

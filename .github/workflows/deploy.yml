name: 🚀 Deploy SMDG to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: 🔑 Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: 🐳 Deploy to VPS
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd /home/smdg/SMDG
            echo "📥 Pulling latest changes from Git..."
            # audit_logs/ is runtime data (bind-mounted). If it was ever tracked, reset would drop it.
            if [[ -f audit_logs/audit.csv ]]; then
              cp -a audit_logs/audit.csv /tmp/smdg-audit-csv.deploy.bak
            fi
            git fetch origin main
            git reset --hard origin/main
            mkdir -p audit_logs
            if [[ -f /tmp/smdg-audit-csv.deploy.bak ]]; then
              cp -a /tmp/smdg-audit-csv.deploy.bak audit_logs/audit.csv
              rm -f /tmp/smdg-audit-csv.deploy.bak
            fi
            echo "🐳 Rebuilding and restarting Docker containers..."
            docker compose down
            docker compose up -d --build
            echo "✅ Deployment complete!"
          EOF
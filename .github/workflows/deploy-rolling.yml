# =============================================================================
# .github/workflows/deploy-rolling.yml
#
# Zero-downtime rolling update deploy для SMDG.
#
# Триггеры:
#   - push в main → build & deploy в production
#   - release (tag vX.Y.Z) → deploy конкретной версии
#   - workflow_dispatch → ручной запуск с выбором тега
#
# Требуемые secrets:
#   DOCKER_USERNAME, DOCKERHUB_TOKEN  — публикация образа
#   DEPLOY_HOST                        — адрес prod-сервера
#   DEPLOY_USER                        — пользователь ssh (deploy)
#   DEPLOY_SSH_KEY                     — приватный ключ
#   DEPLOY_PATH                        — путь до проекта на сервере (/opt/smdg)
#   SLACK_WEBHOOK_URL (опционально)    — нотификация
# =============================================================================
name: Deploy (Rolling Update)

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag (default: git SHA)"
        required: false
        default: ""
      skip_migrations:
        description: "Skip DB migrations (expert mode)"
        required: false
        type: boolean
        default: false
      rollback_on_failure:
        description: "Auto-rollback on failure"
        required: false
        type: boolean
        default: true

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # 1) Build и push Docker образа
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      image_full: ${{ steps.meta.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve image tag
        id: meta
        run: |
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="sha-${GITHUB_SHA::12}"
          fi
          FULL="${{ secrets.DOCKER_USERNAME }}/smdg:${TAG}"
          echo "tag=${TAG}"   >> "$GITHUB_OUTPUT"
          echo "full=${FULL}" >> "$GITHUB_OUTPUT"
          echo "▶ Image: ${FULL}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.full }}
            ${{ secrets.DOCKER_USERNAME }}/smdg:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}

  # ---------------------------------------------------------------------------
  # 2) Zero-downtime deploy на prod-сервер
  # ---------------------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://${{ secrets.DEPLOY_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy latest compose/scripts to server
        run: |
          rsync -azP --delete \
            --include='docker-compose*.yml' \
            --include='nginx/' \
            --include='nginx/**' \
            --include='scripts/' \
            --include='scripts/**' \
            --exclude='*' \
            ./ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Run zero-downtime deploy
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          SKIP_MIGRATIONS: ${{ github.event.inputs.skip_migrations || 'false' }}
          ROLLBACK_ON_FAILURE: ${{ github.event.inputs.rollback_on_failure || 'true' }}
        run: |
          ssh -o StrictHostKeyChecking=no \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              bash -s <<'REMOTE'
            set -Eeuo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            export DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}"
            export IMAGE_TAG="${{ needs.build.outputs.image_tag }}"
            export GIT_SHA="${{ github.sha }}"
            export SKIP_MIGRATIONS="${{ env.SKIP_MIGRATIONS }}"
            export ROLLBACK_ON_FAILURE="${{ env.ROLLBACK_ON_FAILURE }}"
            export DESIRED_REPLICAS="${DESIRED_REPLICAS:-2}"
            export PUSHGATEWAY_URL="${PUSHGATEWAY_URL:-}"

            chmod +x ./scripts/zero_downtime_deploy.sh
            ./scripts/zero_downtime_deploy.sh
          REMOTE

      - name: Smoke-test from CI
        run: |
          HEALTH_URL="https://${{ secrets.DEPLOY_DOMAIN }}/health/ready"
          for i in {1..20}; do
            if curl -sfk --max-time 5 "${HEALTH_URL}" >/dev/null; then
              echo "✅ Prod health OK"
              exit 0
            fi
            echo "waiting... ${i}/20"
            sleep 3
          done
          echo "❌ Prod health FAILED"
          exit 1

      - name: Notify Slack on success
        if: success() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\"✅ SMDG deployed: ${{ needs.build.outputs.image_tag }}\"}" \
            "${SLACK_WEBHOOK_URL}"

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\"❌ SMDG deploy FAILED: ${{ needs.build.outputs.image_tag }} — см. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${SLACK_WEBHOOK_URL}"

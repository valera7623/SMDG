name: CDN Deploy

on:
  push:
    branches: [main]
    paths:
      - "static/**"
      - "app/templates/**"
      - "scripts/generate_asset_manifest.py"
  workflow_dispatch:

jobs:
  deploy-cdn:
    runs-on: ubuntu-latest
    # Запускайте вручную, если в репозитории нет AWS-секретов
    if: github.repository != ''

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --no-interaction

      - name: Generate asset manifest
        run: poetry run python scripts/generate_asset_manifest.py static

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload to S3 (versioned static)
        env:
          S3_BUCKET: ${{ secrets.S3_CDN_BUCKET }}
        run: |
          set -e
          if [ -z "$S3_BUCKET" ]; then echo "S3_CDN_BUCKET secret not set"; exit 0; fi
          aws s3 sync static/ "s3://${S3_BUCKET}/static/" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "manifest.json" \
            --exclude "html/*"
          aws s3 sync static/html/ "s3://${S3_BUCKET}/static/html/" \
            --delete \
            --cache-control "no-cache, no-store, must-revalidate" \
            --exclude "manifest.json"
          if [ -f static/manifest.json ]; then
            aws s3 cp static/manifest.json "s3://${S3_BUCKET}/static/manifest.json" \
              --cache-control "public, max-age=300" --content-type "application/json"
          fi

      - name: Invalidate CloudFront
        env:
          CF_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -z "$CF_ID" ]; then echo "CLOUDFRONT_DISTRIBUTION_ID not set, skip"; exit 0; fi
          aws cloudfront create-invalidation --distribution-id "$CF_ID" --paths "/*"

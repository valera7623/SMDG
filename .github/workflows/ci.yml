name: CI - Tests, Coverage, Security & Docker Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  checks: write
  pull-requests: write
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: smdg
          POSTGRES_USER: smdg_user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'poetry.lock') }}

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --with dev --no-root

      # === НОВЫЙ ШАГ: установка age для тестов crypto ===
      - name: Install age encryption tool
        run: |
          sudo apt-get update
          sudo apt-get install -y age
          echo "✅ age installed:"
          age --version
          age-keygen --version

      - name: Ruff lint
        run: poetry run ruff check app/lifecycle app/bootstrap app/core/version.py app/main.py

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql+asyncpg://smdg_user:password@localhost:5432/smdg
          REDIS_URL: redis://localhost:6379/0
          DEV_MODE: true
        run: |
          poetry run pytest tests/ \
            -v \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-python-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

      - name: Comment coverage in PR
        if: github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@v1
        with:
          title: Coverage Report (Python ${{ matrix.python-version }})
          report_file: coverage.xml
          badge: true
          hide_summary: false
          create_new_comment: false
          hide_branch_rate: false
          hide_complexity: true
          path_prefix: app/
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # security-scan и build-docker без изменений
  security-scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -

      - name: Install Bandit
        run: poetry add --group dev bandit

      - name: Run Bandit security scan
        run: poetry run bandit -r app/ --format json -o bandit-report.json --exit-zero

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 7

  build-docker:
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/smdg:latest
            ${{ secrets.DOCKER_USERNAME }}/smdg:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
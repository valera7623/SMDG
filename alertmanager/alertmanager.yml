# ---------------------------------------------------------------------------
# Inhibit rules
# ---------------------------------------------------------------------------
inhibit_rules:
  # critical подавляет одноимённые warning.
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ["alertname", "service", "instance"]

  # DB упала → не спамим SMDGApiDown (это следствие).
  - source_matchers:
      - alertname = "SMDGDatabaseDown"
    target_matchers:
      - alertname = "SMDGApiDown"
    equal: ["service"]

  # Redis упал → не спамим SMDGReadinessFailing.
  - source_matchers:
      - alertname = "SMDGRedisDown"
    target_matchers:
      - alertname = "SMDGReadinessFailing"
    equal: ["service"]

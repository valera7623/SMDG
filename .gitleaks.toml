title = "SMDG Security Configuration"

[extend]
useDefault = true

[[rules]]
id = "aws-access-key"
description = "AWS Access Key"
regex = '''AKIA[0-9A-Z]{16}'''
tags = ["aws", "key"]

[[rules]]
id = "jwt-token"
description = "JWT Token"
regex = '''eyJ[A-Za-z0-9-_=]+\.[A-Za-z0-9-_=]+\.?[A-Za-z0-9-_.+/=]*'''
tags = ["jwt", "token"]

[[rules]]
id = "private-key"
description = "Private Key"
regex = '''-----BEGIN (RSA|DSA|EC|PGP|OPENSSH) PRIVATE KEY-----'''
tags = ["key", "private"]

[[rules]]
id = "postgres-password"
description = "PostgreSQL Password in URL"
regex = '''postgres(?:ql)?://[^:]+:([^@]+)@'''
tags = ["database", "password"]

[[rules]]
id = "admin-password"
description = "Admin Password in env (literal ADMIN_PASSWORD= only; avoids GRAFANA_ADMIN_PASSWORD etc.)"
regex = '''(?m)^\s*(?:-\s+)?(?:export\s+)?ADMIN_PASSWORD=.*'''
tags = ["password", "admin"]

[allowlist]
description = "Allowlisted paths for test fixtures, local tooling, and non-repo key dirs"
paths = [
  '''^\.git/''',
  '''^reports/''',
  '''^secrets/''',
  '''^\.venv/''',
  '''^node_modules/''',
  '''^\.env\.test$''',
  '''^keys/''',
  '''^audit_logs/''',
  '''__pycache__/''',
  '''.*\.test\.py$''',
  '''.*/test_.*''',
]
# CI uses ephemeral Postgres with a fixed dev-only password and DATABASE_URL; not production credentials.
# Alembic / migration helpers use a string replace, not a real DSN with credentials.
regexes = [
  '''postgresql\+asyncpg://smdg_user:password@localhost:5432/smdg''',
  '''POSTGRES_PASSWORD: password''',
]

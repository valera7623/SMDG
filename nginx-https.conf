include /etc/nginx/conf.d/upstream-target.conf;
resolver 127.0.0.11 ipv6=off valid=30s;

map $http_x_forwarded_proto $smdg_forwarded_proto {
    default $scheme;
    ~^(http|https)$ $http_x_forwarded_proto;
}

map $http_x_forwarded_host $smdg_forwarded_host {
    default $host;
    ~.+ $http_x_forwarded_host;
}

map $http_x_forwarded_port $smdg_forwarded_port {
    default $server_port;
    ~^[0-9]+$ $http_x_forwarded_port;
}

server {
    listen 80;
    # Production: set DOMAIN in .env; localhost kept for local dev certs.
    server_name fileguardian.info www.fileguardian.info localhost;

    # ACME challenge — must be in a location block, NOT server-level return.
    # Server-level `return 301` runs in the rewrite phase before location matching
    # and breaks Let's Encrypt HTTP-01 (LE gets 301 → HTTPS → 404).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name fileguardian.info www.fileguardian.info localhost;

    # Mount production certificates here. For local development, run
    # ./generate_cert.sh to create a self-signed fullchain.pem/privkey.pem pair.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # Базовые заголовки безопасности (без CSP). HSTS preload запрещает браузеру
    # откатываться на HTTP для домена и всех поддоменов после попадания в preload list.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # MkDocs documentation (static site from site/)
    location = /help {
        return 301 /help/;
    }

    location /help/ {
        alias /app/help/;
        index index.html;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests;" always;
        expires 1h;
        access_log off;
    }

    # Специальный location для /docs с мягким CSP
    location /docs {
        # Мягкий CSP для Swagger UI
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https://fastapi.tiangolo.com; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests;" always;

        proxy_pass $smdg_upstream/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $smdg_forwarded_proto;
        proxy_set_header X-Forwarded-Host $smdg_forwarded_host;
        proxy_set_header X-Forwarded-Port $smdg_forwarded_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Специальный location для /openapi.json (Swagger схема)
    location /openapi.json {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;

        proxy_pass $smdg_upstream/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $smdg_forwarded_proto;
        proxy_set_header X-Forwarded-Host $smdg_forwarded_host;
        proxy_set_header X-Forwarded-Port $smdg_forwarded_port;
    }

    # DICOM Viewer — расширенный CSP для OHIF CDN
    location /dicom-viewer {
        client_max_body_size 600M;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https://unpkg.com; font-src 'self' data: https://unpkg.com; connect-src 'self' https://unpkg.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests;" always;

        proxy_pass $smdg_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $smdg_forwarded_proto;
        proxy_set_header X-Forwarded-Host $smdg_forwarded_host;
        proxy_set_header X-Forwarded-Port $smdg_forwarded_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Загрузка файлов — без retry (POST body нельзя безопасно повторять)
    location = /api/upload {
        client_max_body_size 600M;
        client_body_buffer_size 1m;
        client_body_timeout 600s;

        proxy_pass $smdg_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $smdg_forwarded_proto;
        proxy_set_header X-Forwarded-Host $smdg_forwarded_host;
        proxy_set_header X-Forwarded-Port $smdg_forwarded_port;

        proxy_connect_timeout 90s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_next_upstream off;
    }

    # Основной location с жестким CSP
    location / {
        client_max_body_size 600M;
        client_body_buffer_size 128k;
        client_body_timeout 120s;

        # Жесткий CSP для основного приложения
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests;" always;

        proxy_pass $smdg_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $smdg_forwarded_proto;
        proxy_set_header X-Forwarded-Host $smdg_forwarded_host;
        proxy_set_header X-Forwarded-Port $smdg_forwarded_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 300s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_timeout 90s;
        proxy_next_upstream_tries 10;
    }

    # Статические файлы (без CSP)
    location /static/ {
        alias /app/static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
include /etc/nginx/conf.d/upstream-target.conf;
resolver 127.0.0.11 ipv6=off valid=30s;

server {
    listen 80;
    # Production: set this to the real domain in your generated/deployed config.
    # `localhost` is kept for the default developer certificate in ./certs.
    server_name localhost;

    # ACME challenge for Let's Encrypt webroot flow. Mount
    # ./certbot/www:/var/www/certbot:ro from docker-compose.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Всё на HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    # Production: set this to the real domain in your generated/deployed config.
    # `localhost` is kept for the default developer certificate in ./certs.
    server_name localhost;

    # Development defaults use certs/localhost*.pem. In production, mount the
    # real domain certificate/key here or change these paths to fullchain.pem
    # and privkey.pem from your ACME client.
    ssl_certificate     /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # Базовые заголовки безопасности (без CSP)
    # Add `preload` only after the real production domain and subdomains are
    # verified as HTTPS-only.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Специальный location для /docs с мягким CSP
    location /docs {
        # Мягкий CSP для Swagger UI
        add_header Content-Security-Policy "
            default-src 'self';
            script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
            style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
            img-src 'self' data: blob: https://fastapi.tiangolo.com;
            font-src 'self' data: https://cdn.jsdelivr.net;
            connect-src 'self';
            object-src 'none';
            base-uri 'self';
            form-action 'self';
            frame-ancestors 'self';
            upgrade-insecure-requests;
        " always;

        proxy_pass $smdg_upstream/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Специальный location для /openapi.json (Swagger схема)
    location /openapi.json {
        add_header Content-Security-Policy "
            default-src 'self';
            script-src 'self' 'unsafe-inline';
            style-src 'self' 'unsafe-inline';
            img-src 'self' data:;
        " always;

        proxy_pass $smdg_upstream/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # DICOM Viewer — расширенный CSP для OHIF CDN
    location /dicom-viewer {
        client_max_body_size 600M;

        add_header Content-Security-Policy "
            default-src 'self';
            script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com;
            style-src 'self' 'unsafe-inline' https://unpkg.com;
            img-src 'self' data: blob: https://unpkg.com;
            font-src 'self' data: https://unpkg.com;
            connect-src 'self' https://unpkg.com;
            object-src 'none';
            base-uri 'self';
            form-action 'self';
            frame-ancestors 'self';
            upgrade-insecure-requests;
        " always;

        proxy_pass $smdg_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Основной location с жестким CSP
    location / {
        client_max_body_size 600M;
        client_body_buffer_size 128k;
        client_body_timeout 120s;

        # Жесткий CSP для основного приложения
        add_header Content-Security-Policy "
            default-src 'self';
            script-src 'self' 'unsafe-inline';
            style-src 'self' 'unsafe-inline';
            img-src 'self' data: blob:;
            connect-src 'self';
            font-src 'self' data:;
            object-src 'none';
            base-uri 'self';
            form-action 'self';
            frame-ancestors 'self';
            upgrade-insecure-requests;
        " always;

        proxy_pass $smdg_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 300s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_timeout 90s;
        proxy_next_upstream_tries 10;
    }

    # Статические файлы (без CSP)
    location /static/ {
        alias /app/static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
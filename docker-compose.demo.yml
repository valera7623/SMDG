# docker-compose.demo.yml
#
# Lean demo stack for public hosting (2GB RAM server).
# No MinIO, no Prometheus/Grafana — only nginx + PostgreSQL + Redis + app.
#
# Quick start:
#   cp .env.demo.example .env      # fill DOMAIN and JWT_SECRET_KEY
#   docker compose -f docker-compose.demo.yml up -d --build
#
# First-time SSL (run once before starting nginx):
#   docker compose -f docker-compose.demo.yml run --rm certbot \
#     certonly --webroot --webroot-path /var/www/certbot \
#     -d ${DOMAIN} --email ${LETSENCRYPT_EMAIL} --agree-tos --non-interactive

services:

  # ──────────────────────────────────────────────
  # PostgreSQL — minimal, no replica
  # ──────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smdg}
      POSTGRES_USER: ${POSTGRES_USER:-smdg_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo_pg_smdg}
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 192m
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smdg_user} -d ${POSTGRES_DB:-smdg}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ──────────────────────────────────────────────
  # Redis — no persistence, LRU eviction
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    deploy:
      resources:
        limits:
          memory: 96m
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ──────────────────────────────────────────────
  # SMDG application
  # ──────────────────────────────────────────────
  smdg:
    build: .
    restart: unless-stopped
    user: "0:0"
    stop_grace_period: 30s
    stop_signal: SIGTERM
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Demo identity
      DEMO_MODE: "true"
      DEPLOYMENT_TYPE: "demo"
      DEV_MODE: "true"

      # Secrets via env (no Docker secrets in demo)
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Demo1234!}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo_pg_smdg}
      POSTGRES_USER: ${POSTGRES_USER:-smdg_user}
      POSTGRES_DB: ${POSTGRES_DB:-smdg}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"

      # Storage — local filesystem only (no MinIO to save RAM)
      S3_ENABLED: "false"

      # Upload cap for demo (10MB)
      MAX_UPLOAD_SIZE_MB: "10"

      # Redis
      REDIS_URL: "redis://redis:6379/0"
      SESSION_REDIS_URL: "redis://redis:6379/0"
      CACHE_REDIS_URL: "redis://redis:6379/1"
      RATE_LIMIT_STORAGE: "redis://redis:6379/2"
      JOB_QUEUE_REDIS_URL: "redis://redis:6379/3"

      # Security
      COOKIE_SECURE: "true"
      REQUIRE_SECURE_COOKIES: "true"
      CORS_INCLUDE_DEV_ORIGINS: "false"
      CORS_ORIGINS: "https://${DOMAIN:-localhost}"

      # Performance tuning for 2GB server
      WEB_CONCURRENCY: "1"
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "10"
      MAX_CONCURRENT_REQUESTS: "50"
      API_BULKHEAD_MAX_CONCURRENT: "30"
      DICOM_BULKHEAD_MAX_CONCURRENT: "2"
      UPLOAD_BULKHEAD_MAX_CONCURRENT: "3"

      # Disable heavy optional features
      OTEL_ENABLED: "false"
      ARCHIVE_ENABLED: "false"
      DLQ_ENABLED: "false"
      CDN_ENABLED: "false"
      READ_REPLICAS_ENABLED: "false"

      # DICOM reset interval
      DEMO_RESET_INTERVAL_HOURS: ${DEMO_RESET_INTERVAL_HOURS:-24}

      # Public URL (for links and CORS)
      API_PUBLIC_URL: "https://${DOMAIN:-localhost}"

    volumes:
      - smdg_encrypted:/app/encrypted
      - smdg_keys:/app/keys
      - smdg_audit:/app/audit_logs
      - smdg_uploads:/app/uploads
      - smdg_decrypted:/app/decrypted
      - smdg_backups:/app/backups
      - ./certbot/www:/var/www/certbot:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - backend
      - frontend

  # ──────────────────────────────────────────────
  # Nginx — TLS termination + static files
  # ──────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/upstream-target.conf:/etc/nginx/conf.d/upstream-target.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./static:/app/static:ro
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.25"
    depends_on:
      smdg:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - frontend

  # ──────────────────────────────────────────────
  # Certbot — run once: --profile ssl
  #   docker compose -f docker-compose.demo.yml \
  #     --profile ssl run --rm certbot \
  #     certonly --webroot --webroot-path /var/www/certbot \
  #     -d yourdomain.com --email you@email.com \
  #     --agree-tos --non-interactive
  # ──────────────────────────────────────────────
  certbot:
    image: certbot/certbot
    profiles: [ssl]
    volumes:
      - ./certs:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - frontend

volumes:
  pgdata:
  smdg_encrypted:
  smdg_keys:
  smdg_audit:
  smdg_uploads:
  smdg_decrypted:
  smdg_backups:

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge

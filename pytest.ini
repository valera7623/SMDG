# pytest.ini
[pytest]

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

markers =
    integration: marks tests as integration tests (deselect with '-m "not integration"')
    slow: marks tests as slow (deselect with '-m "not slow"')
    unit: unit tests
    asyncio: marks tests as async

# Фильтруем предупреждения, чтобы не засоряли вывод
filterwarnings =
    # Игнорируем deprecation от passlib/crypt
    ignore:'crypt' is deprecated:DeprecationWarning
    # Игнорируем Pydantic V1 warnings
    ignore:Support for class-based `config` is deprecated:PendingDeprecationWarning
    ignore:Pydantic V1 style `@validator`:PendingDeprecationWarning
    # Игнорируем FastAPI on_event deprecation (пока не перешли на lifespan)
    ignore:on_event is deprecated:DeprecationWarning
    # Игнорируем argon2 version warning
    ignore:Accessing argon2\.__version__ is deprecated:DeprecationWarning
    ignore:coroutine '.*' was never awaited:RuntimeWarning



# Покрытие
addopts =
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=75
version: '3.8'

services:
  db-master:
    image: postgres:15-alpine
    container_name: smdg-db-master
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smdg_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-smdg}
      PGDATA: /var/lib/postgresql/data
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - postgres_master_data:/var/lib/postgresql/data
      - ./postgres/master.conf:/etc/postgresql/postgresql.conf:ro
    ports:
      - "5432:5432"
    networks:
      - smdg_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smdg_user} -d ${POSTGRES_DB:-smdg}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-replica-1:
    image: postgres:15-alpine
    container_name: smdg-db-replica-1
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smdg_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-smdg}
      PGDATA: /var/lib/postgresql/data
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - postgres_replica1_data:/var/lib/postgresql/data
      - ./postgres/replica.conf:/etc/postgresql/postgresql.conf:ro
    ports:
      - "5433:5432"
    depends_on:
      db-master:
        condition: service_healthy
    networks:
      - smdg_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smdg_user} -d ${POSTGRES_DB:-smdg}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - replication

  db-replica-2:
    image: postgres:15-alpine
    container_name: smdg-db-replica-2
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smdg_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-smdg}
      PGDATA: /var/lib/postgresql/data
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - postgres_replica2_data:/var/lib/postgresql/data
      - ./postgres/replica.conf:/etc/postgresql/postgresql.conf:ro
    ports:
      - "5434:5432"
    depends_on:
      db-master:
        condition: service_healthy
    networks:
      - smdg_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smdg_user} -d ${POSTGRES_DB:-smdg}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - replication

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: smdg-pgbouncer
    environment:
      DB_HOST: db-master
      DB_USER: ${POSTGRES_USER:-smdg_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
      DB_NAME: ${POSTGRES_DB:-smdg}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 20
    ports:
      - "6432:5432"
    depends_on:
      db-master:
        condition: service_healthy
      db-replica-1:
        condition: service_healthy
      db-replica-2:
        condition: service_healthy
    networks:
      - smdg_network
    profiles:
      - replication

volumes:
  postgres_master_data:
  postgres_replica1_data:
  postgres_replica2_data:

networks:
  smdg_network:
    driver: bridge

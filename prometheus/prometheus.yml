# =============================================================================
# Prometheus configuration for SMDG
# =============================================================================
# Используется совместно с docker-compose.alerting.yml. Монтируется как
# ``/etc/prometheus/prometheus.yml`` + sidecar-файл ``alerts.yml``.
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # NB: Prometheus НЕ раскрывает ${VAR} из окружения в конфиге. Если нужно
  # менять environment между dev/staging/prod — используй envsubst на этапе
  # деплоя (например, в entrypoint.sh) или переопредели этот файл через
  # overlay compose.
  external_labels:
    environment: "production"
    cluster: "smdg"

# ---------------------------------------------------------------------------
# Alertmanager: куда Prometheus отправляет сработавшие правила.
# При недоступности Alertmanager приложение SMDG продолжает работать — это
# изолированный компонент мониторинга.
# ---------------------------------------------------------------------------
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"
      timeout: 10s
      api_version: v2

# ---------------------------------------------------------------------------
# Правила алертов. Файл грузится из той же директории, что и этот конфиг.
# ---------------------------------------------------------------------------
rule_files:
  - "alerts.yml"

# ---------------------------------------------------------------------------
# Scrape targets
# ---------------------------------------------------------------------------
scrape_configs:

  # Сам Prometheus — self-monitoring.
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # SMDG API (экспортирует /metrics через prometheus-fastapi-instrumentator).
  # scrape_timeout увеличен до 15s потому что /metrics проходит через
  # тяжёлый middleware-стек SMDG (auth, tenant resolution, audit). При
  # деградации зависимостей (например, БД недоступна) те же middleware
  # могут отдать ответ позже 8s — таргет уйдёт в DOWN не по вине /metrics,
  # а по фоновой latency. 15s с запасом покрывает worst-case.
  - job_name: "smdg"
    static_configs:
      - targets: ["smdg:8000"]
    metrics_path: "/metrics"
    scrape_interval: 15s
    scrape_timeout: 14s

  # -------------------------------------------------------------------------
  # Опциональные exporter'ы. Раскомментируй, когда поднимешь соответствующий
  # сервис (postgres-exporter, redis-exporter, node-exporter, cadvisor).
  # Node/cadvisor живут под compose profile `host-metrics` — см. docker-compose.alerting.yml.
  # -------------------------------------------------------------------------
  # - job_name: "postgres-exporter"
  #   static_configs:
  #     - targets: ["postgres-exporter:9187"]
  #
  # - job_name: "redis-exporter"
  #   static_configs:
  #     - targets: ["redis-exporter:9121"]
  #
  # - job_name: "node-exporter"
  #   static_configs:
  #     - targets: ["node-exporter:9100"]
  #
  # - job_name: "cadvisor"
  #   static_configs:
  #     - targets: ["cadvisor:8080"]

  # Alertmanager — self-monitoring.
  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]

  # Blackbox exporter — внешние probes (HTTP, TCP, DNS).
  # Пробует /health/live и /health/ready извне (через DNS имя сервиса).
  - job_name: "blackbox-http"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - "http://smdg:8000/health/live"
          - "http://smdg:8000/health/ready"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

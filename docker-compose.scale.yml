services:
  nginx-lb:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx-load-balancer.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/ssl:ro
    ports:
      - "18080:80"
      - "18443:443"
    depends_on:
      smdg:
        condition: service_healthy
    networks:
      - smdg_network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  smdg:
    image: ${DOCKER_USERNAME:-smdg}/smdg:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    user: "0:0"
    environment:
      - INSTANCE_NAME=smdg
      - HORIZONTAL_SCALING_ENABLED=true
      - SESSION_REDIS_URL=redis://redis:6379/0
      - CACHE_REDIS_URL=redis://redis:6379/1
      - RATE_LIMIT_STORAGE=redis://redis:6379/2
      - JOB_QUEUE_REDIS_URL=redis://redis:6379/3
      - FILE_STORAGE=s3
      - DATABASE_URL=postgresql+asyncpg://smdg_user:${POSTGRES_PASSWORD:-password}@db-master:5432/smdg
      - POSTGRES_HOST=db-master
      - POSTGRES_PORT=5432
      - POSTGRES_DB=smdg
      - POSTGRES_USER=smdg_user
      - REDIS_URL=redis://redis:6379/2
      - S3_ENABLED=true
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin123}
    secrets:
      - source: age_private_key
        target: age_private_key
        uid: "1000"
        gid: "1000"
        mode: 0440
      - source: admin_password
        target: admin_password
        uid: "1000"
        gid: "1000"
        mode: 0440
      - source: jwt_secret_key
        target: jwt_secret_key
        uid: "1000"
        gid: "1000"
        mode: 0440
      - source: postgres_password
        target: postgres_password
        uid: "1000"
        gid: "1000"
        mode: 0440
    depends_on:
      redis:
        condition: service_healthy
      db-master:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - smdg_network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 180s

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - smdg_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-master:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=smdg_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=smdg
    volumes:
      - postgres_master_data:/var/lib/postgresql/data
    networks:
      smdg_network:
         aliases:
           - db
           - db-master 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smdg_user -d smdg"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-replica-1:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=smdg_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=smdg
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    depends_on:
      db-master:
        condition: service_healthy
    networks:
      - smdg_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smdg_user -d smdg"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:-minioadmin123}
    volumes:
      - minio_data:/data
    networks:
      - smdg_network

  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./prometheus/sla-rules.yml:/etc/prometheus/sla-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "19090:9090"
    networks:
      - smdg_network

  grafana:
    image: grafana/grafana:latest
    profiles: ["observability"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_DASH_PASS:-local-scale-grafana-only}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "13000:3000"
    networks:
      - smdg_network

volumes:
  redis_data:
  postgres_master_data:
  postgres_replica_data:
  prometheus_data:
  grafana_data:
  minio_data:

networks:
  smdg_network:
    driver: bridge

secrets:
  age_private_key:
    file: ./secrets/age.key
  admin_password:
    file: ./secrets/admin_password.txt
  jwt_secret_key:
    file: ./secrets/jwt_secret.txt
  postgres_password:
    file: ./secrets/postgres_password.txt

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  {% include "partials/yandex_metrika.html" %}
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <title>SMDG — Secure Medical Data Gateway</title>
  <meta name="description" content="SMDG: безопасная передача и хранение медицинских файлов с шифрованием, аудитом и DICOM-просмотром." />
  <meta name="theme-color" content="#2563eb" />
  <link rel="canonical" href="/" />

  {% if cdn_url %}
  <link rel="preconnect" href="{{ cdn_url }}">
  <link rel="dns-prefetch" href="{{ cdn_url }}">
  {% endif %}

  <link rel="icon" href="{{ asset_url('favicon.ico') }}" sizes="any" />
  <link rel="stylesheet" href="{{ asset_url('css/styles.css') }}" />
  <link rel="stylesheet" href="{{ asset_url('css/smdg-extensions.css') }}" />
  <link rel="stylesheet" href="{{ asset_url('css/language-selector.css') }}" />

  <script>
    (function () {
      var map = {
        "/admin": "#/admin/files",
        "/admin/": "#/admin/files",
        "/admin/users": "#/admin/users",
        "/admin/users/": "#/admin/users",
        "/admin/dlq": "#/admin/dlq",
        "/admin/dlq/": "#/admin/dlq",
      };
      var target = map[location.pathname];
      if (target && !location.hash) location.replace(target);
    })();
  </script>

  <script src="{{ asset_url('js/vendors/qrcode.min.js') }}"></script>
  <script src="{{ asset_url('js/i18n.js') }}" defer></script>
</head>
<body>
{% if demo_mode %}
<div id="demoBanner" class="demo-banner" role="alert" aria-live="polite" style="background:#fef3c7;color:#92400e;padding:.6rem 1rem;text-align:center;font-size:.875rem;border-bottom:1px solid #fcd34d">
  <strong>Live Demo</strong> — данные сбрасываются каждые 24 часа.
  <button type="button" class="btn btn-sm" onclick="smdgFillDemo('admin_demo','Demo1234!')">Admin</button>
  <button type="button" class="btn btn-sm" onclick="smdgFillDemo('doctor_demo','Demo1234!')">Doctor</button>
  <button type="button" class="btn btn-sm" onclick="smdgFillDemo('user_demo','Demo1234!')">Patient</button>
  (password: <code>Demo1234!</code>)
</div>
<script>
  window.smdgFillDemo = function (user, pass) {
    location.hash = '#/login';
    setTimeout(function () {
      var u = document.getElementById('loginUsername');
      var p = document.getElementById('loginPassword');
      if (u) u.value = user;
      if (p) p.value = pass;
    }, 200);
  };
</script>
{% endif %}

  <div id="app"></div>
  <div id="toast-container" aria-live="polite"></div>
  <div id="modal-root"></div>
  <noscript>
    <p style="padding:1rem;font-family:system-ui,sans-serif">
      SMDG требует JavaScript. <a href="#/login">Войти</a> или откройте <a href="/docs">документацию API</a>.
    </p>
  </noscript>
  <script type="module" src="{{ asset_url('js/app.js') }}"></script>
</body>
</html>

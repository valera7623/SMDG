# =============================================================================
# nginx/nginx-zero-downtime.conf — Zero-downtime load balancer
#
# Что важно для zero-downtime:
#   1. Динамический resolver (Docker embedded DNS 127.0.0.11) + proxy_pass
#      через переменные — nginx стартует даже если backend ещё не в DNS.
#   2. proxy_next_upstream — при 502/503/504/timeout запрос авто-
#      повторяется на следующем upstream.
#   3. /healthz — дешёвый liveness-endpoint самого nginx.
# =============================================================================

# Docker embedded DNS (127.0.0.11). valid=10s — обновляем IP реплик каждые 10с.
resolver 127.0.0.11 valid=10s ipv6=off;

# Preserve external TLS termination headers when nginx is behind a CDN/LB.
map $http_x_forwarded_proto $smdg_forwarded_proto {
    default $scheme;
    ~^(http|https)$ $http_x_forwarded_proto;
}

map $http_x_forwarded_host $smdg_forwarded_host {
    default $host;
    ~.+ $http_x_forwarded_host;
}

map $http_x_forwarded_port $smdg_forwarded_port {
    default $server_port;
    ~^[0-9]+$ $http_x_forwarded_port;
}

# Docker DNS names can be temporarily absent while services are still starting.
# Variables defer DNS resolution until request time, so nginx can still boot and
# serve ACME/redirect/healthz before smdg, Grafana or Jaeger are ready.
map $request_uri $smdg_upstream {
    default http://smdg:8000;
}

map $request_uri $grafana_upstream {
    default http://grafana:3000;
}

map $request_uri $prometheus_upstream {
    default http://prometheus:9090;
}

map $request_uri $jaeger_upstream {
    default http://jaeger:16686;
}

# -----------------------------------------------------------------------------
# Параметры проксирования — применяются во всех location
# -----------------------------------------------------------------------------
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $smdg_forwarded_proto;
proxy_set_header X-Forwarded-Host $smdg_forwarded_host;
proxy_set_header X-Forwarded-Port $smdg_forwarded_port;

# Во время rolling update: при ошибке/timeout — retry на другой upstream.
# НЕ ретраим non_idempotent запросы (POST/PATCH) без заголовка, кроме явных 5xx.
proxy_next_upstream        error timeout http_502 http_503 http_504;
proxy_next_upstream_tries  3;
proxy_next_upstream_timeout 15s;

# Таймауты — разумный баланс: деплой за <60с, uploads до 5 минут
proxy_connect_timeout 5s;
proxy_send_timeout    300s;
proxy_read_timeout    300s;

# -----------------------------------------------------------------------------
# HTTP → HTTPS redirect
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # /healthz возвращает 200 по HTTP — используется Docker healthcheck
    # самого nginx (не требует SSL).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ACME challenge для Let's Encrypt (если нужно)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# Основной HTTPS сервер
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2  on;
    # Production: replace `_` with the real domain in the deployed config, or
    # keep this server behind an external TLS-terminating load balancer.
    server_name _;

    # Mount production certificates here. For local development, run
    # ./generate_cert.sh to create a self-signed fullchain.pem/privkey.pem pair.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # Security headers. HSTS preload intentionally forbids browser HTTP
    # fallback for this domain and all subdomains once browsers preload it.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upload limits
    client_max_body_size    600M;
    client_body_buffer_size 128k;
    client_body_timeout     120s;

    # -------------------------------------------------------------------------
    # Health endpoints (публично доступны без CSP — нужны для LB и алертов)
    # -------------------------------------------------------------------------
    # /health/live — liveness самого SMDG через upstream
    location = /health/live {
        access_log off;
        proxy_pass $smdg_upstream;
    }

    # /health/ready — readiness. НЕ ретраим 503, чтобы оркестратор видел правду.
    location = /health/ready {
        access_log off;
        proxy_pass $smdg_upstream;
        proxy_next_upstream off;
    }

    # /healthz — возвращает 200 от nginx самого (для внешних monitoring-систем)
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Metrics — только для Prometheus (закрыто firewall, но на всякий случай)
    location = /metrics {
        allow 172.16.0.0/12;   # docker networks
        allow 10.0.0.0/8;
        deny all;
        proxy_pass $smdg_upstream;
    }

    # -------------------------------------------------------------------------
    # Swagger docs (особый CSP)
    # -------------------------------------------------------------------------
    location /docs {
        add_header Content-Security-Policy "
            default-src 'self';
            script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
            style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
            img-src 'self' data: blob: https://fastapi.tiangolo.com;
            font-src 'self' data: https://cdn.jsdelivr.net;
            connect-src 'self';
            object-src 'none';
            base-uri 'self';
            form-action 'self';
            frame-ancestors 'self';
            upgrade-insecure-requests;
        " always;

        proxy_pass $smdg_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $smdg_forwarded_proto;
        proxy_set_header X-Forwarded-Host $smdg_forwarded_host;
        proxy_set_header X-Forwarded-Port $smdg_forwarded_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /openapi.json {
        proxy_pass $smdg_upstream;
    }

    # -------------------------------------------------------------------------
    # DICOM Viewer (большие uploads + внешний CDN)
    # -------------------------------------------------------------------------
    location /dicom-viewer {
        client_max_body_size 600M;

        add_header Content-Security-Policy "
            default-src 'self';
            script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com;
            style-src 'self' 'unsafe-inline' https://unpkg.com;
            img-src 'self' data: blob: https://unpkg.com;
            font-src 'self' data: https://unpkg.com;
            connect-src 'self' https://unpkg.com;
            object-src 'none';
            base-uri 'self';
            form-action 'self';
            frame-ancestors 'self';
            upgrade-insecure-requests;
        " always;

        proxy_pass $smdg_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $smdg_forwarded_proto;
        proxy_set_header X-Forwarded-Host $smdg_forwarded_host;
        proxy_set_header X-Forwarded-Port $smdg_forwarded_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # -------------------------------------------------------------------------
    # Статические файлы — отдаются nginx напрямую, не зависят от smdg
    # -------------------------------------------------------------------------
    location /static/ {
        alias /app/static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # Grafana / Prometheus — через upstream (для sub-path доступа)
    # -------------------------------------------------------------------------
    # Grafana имеет собственную аутентификацию (GF_SECURITY_ADMIN_*),
    # поэтому дополнительный auth_basic не нужен — наоборот, мешал бы
    # API-клиентам и Grafana-плагинам.
    location /grafana/ {
        rewrite ^/grafana/(.*)$ /$1 break;
        proxy_pass $grafana_upstream;
    }

    # -------------------------------------------------------------------------
    # Prometheus UI / API — встроенной аутентификации у Prometheus НЕТ,
    # а через UI доступны имена всех targets, внутренние labels, ошибки
    # scrape'ов, PromQL с именами метрик бизнес-логики. Для медицинской
    # системы это чувствительно (потенциальный вектор разведки), поэтому
    # обязателен Basic Auth.
    #
    # Файл учёток: secrets/.htpasswd-prometheus
    # Создание:    bash scripts/generate-htpasswd.sh prometheus <user>
    # -------------------------------------------------------------------------
    location /prometheus/ {
        auth_basic           "Prometheus (restricted)";
        auth_basic_user_file /etc/nginx/.htpasswd-prometheus;

        rewrite ^/prometheus/(.*)$ /$1 break;
        proxy_pass $prometheus_upstream;
    }

    # -------------------------------------------------------------------------
    # Jaeger UI — distributed tracing.
    #
    # Порт 16686 контейнера jaeger в production-стеке наружу НЕ торчит
    # (см. docker-compose.observability.prod.yml), единственная точка
    # входа — этот location. Basic Auth обязателен: Jaeger не имеет
    # встроенной аутентификации, а в трассах видны пути запросов,
    # имена таблиц, длительности — для медицинской системы это чувствительно.
    #
    # Конфигурация Jaeger всё время генерирует абсолютные ссылки от
    # ``QUERY_BASE_PATH=/jaeger``, поэтому sub-path работает без переписывания.
    #
    # Файл учёток: secrets/.htpasswd-jaeger
    # Создание:    bash scripts/generate-htpasswd.sh jaeger <user>
    # -------------------------------------------------------------------------
    location /jaeger/ {
        auth_basic           "Jaeger (restricted)";
        auth_basic_user_file /etc/nginx/.htpasswd-jaeger;

        proxy_pass $jaeger_upstream;

        # Jaeger UI использует WebSocket для live-обновления search —
        # пробрасываем Upgrade.
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $smdg_forwarded_proto;
        proxy_set_header   X-Forwarded-Host $smdg_forwarded_host;
        proxy_set_header   X-Forwarded-Port $smdg_forwarded_port;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # Большие ответы с треями спанов могут весить МБ — увеличиваем лимиты.
        proxy_read_timeout 120s;
        client_max_body_size 0;
    }

    # -------------------------------------------------------------------------
    # Основной location — main app с жёстким CSP
    # -------------------------------------------------------------------------
    location / {
        add_header Content-Security-Policy "
            default-src 'self';
            script-src 'self' 'unsafe-inline';
            style-src 'self' 'unsafe-inline';
            img-src 'self' data: blob:;
            connect-src 'self';
            font-src 'self' data:;
            object-src 'none';
            base-uri 'self';
            form-action 'self';
            frame-ancestors 'self';
            upgrade-insecure-requests;
        " always;

        proxy_pass $smdg_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $smdg_forwarded_proto;
        proxy_set_header X-Forwarded-Host $smdg_forwarded_host;
        proxy_set_header X-Forwarded-Port $smdg_forwarded_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

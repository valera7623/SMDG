# Пример: reverse-proxy отдаёт API с бэкенда, запросы к /static/ перенаправляет на CDN.
# Подставьте реальный $cdn_base (или используйте envsubst при деплое).

upstream smdg_backend {
    server smdg:8000;
}

map $http_host $cdn_base {
    default "https://cdn.smdg.com";
}

server {
    listen 80;
    server_name smdg.local;

    # API и HTML остаются на origin
    location / {
        proxy_pass http://smdg_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Статика: редирект на CDN (страницы сами ссылаются на CDN; это для прямых /static/ URL)
    location /static/ {
        return 301 $cdn_base$request_uri;
    }
}

# Опционально: кэш на nginx для сценария «без редиректа» (бэкенд как origin для CDN)
# — тогда proxy_pass в S3/MinIO; здесь — только схема с 301.

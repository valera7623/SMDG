# nginx/nginx-compression.conf
# SMDG Nginx configuration with compression

# Brotli module (if compiled)
# load_module modules/ngx_http_brotli_filter_module.so;
# load_module modules/ngx_http_brotli_static_module.so;

server {
    listen 80;
    listen 443 ssl http2;

    server_name smdg.local;

    # Gzip configuration
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 500;
    gzip_types
        text/plain
        text/html
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xhtml+xml
        application/rss+xml
        application/atom+xml
        application/ld+json
        application/manifest+json
        application/vnd.api+json
        application/dicom+json
        image/svg+xml;

    # Brotli configuration (if module available)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_min_length 500;
    # brotli_types
    #     text/plain
    #     text/html
    #     text/css
    #     text/xml
    #     text/javascript
    #     application/json
    #     application/javascript
    #     application/xml
    #     application/xhtml+xml;

    # Disable compression for already compressed files
    gzip_disable "msie6";

    location / {
        proxy_pass http://smdg:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass Accept-Encoding to backend
        proxy_set_header Accept-Encoding $http_accept_encoding;
    }

    # Serve static files with compression
    location /static/ {
        alias /app/static/;
        expires 30d;
        gzip_static on;
        gzip_vary on;
    }
}

resolver 127.0.0.11 valid=10s ipv6=off;

upstream smdg_backend {
    zone smdg_backend 64k;
    least_conn;
    server smdg-scale-smdg-2:8000 resolve max_fails=3 fail_timeout=30s;

    keepalive 32;
}

server {
    listen 80;
    listen 443 ssl http2;
    server_name smdg.local;

    ssl_certificate /etc/nginx/ssl/localhost.pem;
    ssl_certificate_key /etc/nginx/ssl/localhost-key.pem;

    gzip on;
    gzip_types application/json text/html text/css application/javascript;

    location / {
        proxy_pass http://smdg_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    location = /health {
        proxy_pass http://smdg_backend/health/live;
        proxy_next_upstream off;
    }

    location = /health/live {
        proxy_pass http://smdg_backend/health/live;
        proxy_next_upstream off;
    }

    location = /health/ready {
        proxy_pass http://smdg_backend/health/ready;
        proxy_next_upstream off;
    }

    location /metrics {
        proxy_pass http://smdg_backend/metrics;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover">
    <title data-i18n="viewer.ohif_title">SMDG — DICOM Viewer</title>
    <link rel="stylesheet" href="/static/css/language-selector.css">
    <link rel="stylesheet" href="/static/css/dicom-viewer-layout.css">
    <script src="/static/js/i18n.js" defer></script>
    <style>
        :root {
            --dv-bg: #0c1224;
            --dv-panel: #121a2e;
            --dv-border: #2a3548;
            --dv-accent: #6ea8fe;
            --dv-accent-strong: #0d6efd;
            --dv-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; background: #000; color: #e8eaed; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        
        /* Loading screen */
        #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--dv-bg); z-index: 9999; }
        #loading .spinner { width: 48px; height: 48px; border: 4px solid rgba(148,163,184,0.25); border-top-color: var(--dv-accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading p { color: var(--dv-muted); }
        
        /* Error screen */
        #error { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; background: var(--dv-bg); text-align: center; padding: 20px; z-index: 9999; }
        #error h2 { color: #f85149; margin-bottom: 12px; }
        #error p { color: var(--dv-muted); margin-bottom: 8px; }
        #error a { color: var(--dv-accent); text-decoration: none; }
        #error a:hover { text-decoration: underline; }
        
        /* Main layout */
        #viewer-layout { display: none; flex-direction: column; height: 100%; }
        
        /* Header */
        #viewer-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; background: linear-gradient(180deg, #1a1a2e 0%, #141c33 100%); border-bottom: 1px solid var(--dv-border); font-size: 13px; flex-shrink: 0; }
        #viewer-header .file-name { font-weight: 600; color: var(--dv-accent); }
        #viewer-header .meta { color: #888; font-size: 12px; }
        #viewer-header .header-buttons { display: flex; gap: 8px; }
        
        /* Toolbar */
        #toolbar { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 12px; background: var(--dv-panel); border-bottom: 1px solid var(--dv-border); flex-shrink: 0; align-items: center; }
        .tool-btn { padding: 5px 12px; background: #1e293b; border: 1px solid var(--dv-border); border-radius: 8px; color: #e8eaed; font-size: 12px; cursor: pointer; transition: all 0.1s; }
        .tool-btn:hover { background: #253041; border-color: var(--dv-accent); }
        .tool-btn.active { background: var(--dv-accent-strong); border-color: var(--dv-accent-strong); color: #fff; }
        .tool-btn.danger { background: #e74c3c; border-color: #e74c3c; color: #fff; }
        .tool-btn.danger:hover { background: #c0392b; }
        .sep { width: 1px; background: var(--dv-border); margin: 0 6px; height: 24px; }
        .preset-group { display: inline-flex; gap: 4px; margin-left: 8px; }
        .preset-btn { padding: 5px 10px; background: #1e2540; border: 1px solid var(--dv-border); border-radius: 6px; color: #cbd5e1; font-size: 11px; cursor: pointer; }
        .preset-btn:hover { background: #2a3350; border-color: var(--dv-accent); color: #fff; }
        
        /* Viewport */
        #viewport-container { flex: 1; position: relative; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; min-height: 0; }
        #dicom-img { max-width: 100%; max-height: 100%; object-fit: contain; cursor: crosshair; transition: opacity 0.15s; transform-origin: center center; }
        #dicom-img.tool-pan { cursor: grab; }
        #dicom-img.tool-pan:active { cursor: grabbing; }
        #dicom-img.tool-window { cursor: ew-resize; }
        #dicom-img.tool-measure { cursor: crosshair; }
        #dicom-img.loading { opacity: 0.5; }

        /* Measurement Canvas overlay */
        #measurement-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

        /* Measurement toolbar */
        #measure-toolbar { display: none; position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(18, 26, 46, 0.95); backdrop-filter: blur(10px); border: 1px solid var(--dv-border); border-radius: 10px; padding: 8px 12px; z-index: 100; gap: 6px; align-items: center; }
        #measure-toolbar.show { display: flex; }
        .measure-btn { padding: 6px 12px; background: #1e293b; border: 1px solid var(--dv-border); border-radius: 6px; color: #e8eaed; font-size: 12px; cursor: pointer; white-space: nowrap; }
        .measure-btn:hover { background: #253041; border-color: var(--dv-accent); }
        .measure-btn.active { background: #238636; border-color: #238636; color: #fff; }
        .measure-btn.danger { background: #da3633; border-color: #da3633; color: #fff; }
        .measure-btn.danger:hover { background: #b62324; }

        /* Measurement results panel */
        #measure-results { display: none; position: absolute; top: 60px; right: 10px; background: rgba(18, 26, 46, 0.95); backdrop-filter: blur(10px); border: 1px solid var(--dv-border); border-radius: 10px; padding: 12px; z-index: 100; min-width: 220px; max-height: 400px; overflow-y: auto; font-size: 12px; }
        #measure-results.show { display: block; }
        #measure-results h4 { color: var(--dv-accent); margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
        .measure-item { padding: 6px 0; border-bottom: 1px solid #21262d; }
        .measure-item:last-child { border-bottom: none; }
        .measure-label { color: #8b949e; font-size: 10px; text-transform: uppercase; margin-bottom: 2px; }
        .measure-value { color: #e0e0e0; font-family: 'Courier New', monospace; font-size: 13px; font-weight: 600; }
        .measure-value.distance { color: #3fb950; }
        .measure-value.angle { color: #d29922; }
        .measure-value.roi { color: #f778ba; }
        
        /* Status bar */
        #status-bar { display: flex; justify-content: space-between; padding: 5px 16px; background: var(--dv-panel); border-top: 1px solid var(--dv-border); font-size: 11px; color: var(--dv-muted); flex-shrink: 0; }
        #wl-info { font-family: monospace; color: var(--dv-accent); }
        
        /* Metadata panel */
        #metadata-panel { position: absolute; top: 0; right: 0; width: 280px; height: 100%; background: rgba(18, 26, 46, 0.98); backdrop-filter: blur(8px); border-left: 1px solid var(--dv-border); overflow-y: auto; padding: 12px; font-size: 12px; display: none; z-index: 100; transition: display 0.2s; }
        #metadata-panel.show { display: block; }
        #metadata-panel h4 { color: var(--dv-accent); margin: 12px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--dv-border); padding-bottom: 3px; }
        #metadata-panel h4:first-child { margin-top: 0; }
        #metadata-panel .row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #21262d; gap: 8px; }
        #metadata-panel .label { color: #888; font-size: 11px; flex-shrink: 0; }
        #metadata-panel .value { color: #e0e0e0; text-align: right; word-break: break-word; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #metadata-panel .value[title]:hover { overflow: visible; white-space: normal; background: #1a1a2e; position: relative; z-index: 1; }
        
        /* Close button */
        .close-btn { background: #e74c3c; color: #fff; border: none; padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
        .close-btn:hover { background: #c0392b; }

        /* Frame slider */
        #frame-control { display: none; padding: 6px 12px; background: var(--dv-panel); border-top: 1px solid var(--dv-border); flex-shrink: 0; }
        #frame-control.show { display: block; }
        .frame-slider-container { display: flex; align-items: center; gap: 8px; }
        .frame-slider { flex: 1; -webkit-appearance: none; appearance: none; height: 4px; background: rgba(148,163,184,0.25); border-radius: 2px; outline: none; cursor: pointer; }
        .frame-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; background: var(--dv-accent-strong); border-radius: 50%; cursor: pointer; }
        .frame-slider::-moz-range-thumb { width: 14px; height: 14px; background: var(--dv-accent-strong); border-radius: 50%; cursor: pointer; border: none; }
        .frame-info { color: var(--dv-accent); font-family: monospace; font-size: 11px; min-width: 80px; text-align: center; }
        .frame-btn { padding: 4px 10px; background: #1e293b; border: 1px solid var(--dv-border); border-radius: 4px; color: #e8eaed; font-size: 11px; cursor: pointer; }
        .frame-btn:hover { background: #253041; border-color: var(--dv-accent); }
        .frame-btn.active { background: var(--dv-accent-strong); border-color: var(--dv-accent-strong); color: #fff; }
        .speed-control { display: none; align-items: center; gap: 4px; margin-left: 8px; }
        .speed-control.show { display: flex; }
        .speed-label { color: #888; font-size: 10px; }
        .speed-slider { width: 60px; -webkit-appearance: none; appearance: none; height: 3px; background: rgba(148,163,184,0.25); border-radius: 2px; outline: none; }
        .speed-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; background: #8b949e; border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <p data-i18n="viewer.loading">Loading DICOM…</p>
    </div>

    <div id="error">
        <div>
            <h2>⚠️ <span data-i18n="viewer.error">Error</span></h2>
            <p id="errorMsg"></p>
            <p><a href="#" onclick="window.parent.postMessage('dicom-close','*'); return false;">← <span data-i18n="viewer.close">Close</span></a></p>
        </div>
    </div>

    <div id="viewer-layout">
        <div id="viewer-header">
            <span class="file-name" id="fileName">—</span>
            <span class="meta" id="fileMeta">—</span>
            <div class="header-buttons">
                <button class="tool-btn" onclick="toggleMetadata()" data-i18n-title="viewer.metadata" title="Metadata">ℹ️</button>
                <button class="tool-btn" onclick="downloadDicom()" data-i18n-title="viewer.download_dicom" title="Download original DICOM">💾</button>
                <button class="tool-btn danger" onclick="window.parent.postMessage('dicom-close','*')" data-i18n-title="viewer.close" title="Close">✕</button>
            </div>
        </div>

        <div id="toolbar-zoom-row" aria-label="Zoom controls">
            <button type="button" class="tool-btn" onclick="zoomStepOut()" data-i18n-title="viewer.zoom_out" title="Zoom out" aria-label="Zoom out">−</button>
            <button type="button" class="tool-btn" onclick="zoomStepIn()" data-i18n-title="viewer.zoom_in" title="Zoom in" aria-label="Zoom in">+</button>
            <button type="button" class="tool-btn" onclick="resetView()" data-i18n-title="viewer.tool_reset" title="Reset view" aria-label="Reset view">⟲</button>
            <button type="button" class="tool-btn" id="dicomToolbarToggle" onclick="toggleDicomMainToolbar()"
                data-i18n-title="viewer.toggle_toolbar" title="Show or hide toolbars" aria-expanded="true" aria-controls="toolbar">☰</button>
        </div>

        <div id="toolbar">
            <button class="tool-btn active" data-tool="window" onclick="setTool('window')">🪟 <span data-i18n="viewer.tool_window">Window (WL/WW)</span></button>
            <button class="tool-btn" data-tool="zoom" onclick="setTool('zoom')">🔍 <span data-i18n="viewer.tool_zoom">Zoom</span></button>
            <button class="tool-btn" data-tool="pan" onclick="setTool('pan')">✋ <span data-i18n="viewer.tool_pan">Pan</span></button>
            <button class="tool-btn" data-tool="cine" onclick="setTool('cine')" id="cine-btn" style="display:none;">▶️ <span data-i18n="viewer.tool_cine">Cine</span></button>
            <div class="sep"></div>
            <button class="tool-btn" onclick="toggleMeasurementMode()" id="measure-btn" data-i18n-title="viewer.tool_measure_tools" title="Measurement tools">📐 <span data-i18n="dicom.measure">Measurements</span></button>
            <div class="sep"></div>
            <button class="tool-btn" onclick="takeScreenshot()" id="screenshot-btn" data-i18n-title="viewer.screenshot_hint" title="Screenshot (PNG)">📸 <span data-i18n="dicom.screenshot">Screenshot</span></button>
            <div class="sep"></div>
            <button class="tool-btn" onclick="resetView()">↺ <span data-i18n="viewer.tool_reset">Reset</span></button>
            <button class="tool-btn" onclick="invertView()">◐ <span data-i18n="viewer.tool_invert">Invert</span></button>
            <div class="sep"></div>
            <div class="preset-group">
                <span style="color:#666; font-size:11px; margin-right:4px;" data-i18n="viewer.presets_label">Presets:</span>
                <button class="preset-btn" onclick="setPreset('Bone')">🦴 <span data-i18n="dicom.bone">Bone</span></button>
                <button class="preset-btn" onclick="setPreset('Lung')">🫁 <span data-i18n="dicom.lung">Lung</span></button>
                <button class="preset-btn" onclick="setPreset('Brain')">🧠 <span data-i18n="dicom.brain">Brain</span></button>
                <button class="preset-btn" onclick="setPreset('Abdomen')">🫀 <span data-i18n="dicom.abdomen">Abdomen</span></button>
                <button class="preset-btn" onclick="setPreset('Liver')">🍖 <span data-i18n="dicom.liver">Liver</span></button>
            </div>
        </div>
        
        <div id="viewport-container">
            <img id="dicom-img" src="" alt="DICOM Medical Image" draggable="false">
            <canvas id="measurement-canvas"></canvas>
            <div id="metadata-backdrop" class="dicom-meta-backdrop" hidden aria-hidden="true" role="presentation"
                 onclick="if(window._closeDicomMetadata)window._closeDicomMetadata()"></div>
            <div id="metadata-panel"></div>

            <!-- Measurement Toolbar -->
            <div id="measure-toolbar">
                <button class="measure-btn" data-measure="ruler" onclick="setMeasureTool('ruler')" data-i18n-title="viewer.measure_ruler" title="Ruler">📏 <span data-i18n="viewer.measure_ruler">Ruler</span></button>
                <button class="measure-btn" data-measure="angle" onclick="setMeasureTool('angle')" data-i18n-title="viewer.measure_angle" title="Angle">📐 <span data-i18n="viewer.measure_angle">Angle</span></button>
                <button class="measure-btn" data-measure="rect" onclick="setMeasureTool('rect')" data-i18n-title="viewer.measure_roi_rect" title="ROI Rectangle">⬜ ROI</button>
                <button class="measure-btn" data-measure="ellipse" onclick="setMeasureTool('ellipse')" data-i18n-title="viewer.measure_roi_ellipse" title="ROI Ellipse">⭕ ROI</button>
                <div style="width: 1px; background: var(--dv-border); height: 24px; margin: 0 4px;"></div>
                <button class="measure-btn" onclick="undoMeasurement()" data-i18n-title="viewer.measure_undo" title="Undo">↩️</button>
                <button class="measure-btn danger" onclick="clearMeasurements()" data-i18n-title="viewer.measure_clear_all" title="Clear all">🗑️</button>
                <button class="measure-btn" onclick="toggleMeasurePanel()" data-i18n-title="viewer.close" title="Close">✕</button>
            </div>

            <!-- Measurement Results Panel -->
            <div id="measure-results"></div>
        </div>

        <div id="frame-control">
            <div class="frame-slider-container">
                <button class="frame-btn" onclick="firstFrame()" data-i18n-title="viewer.first_frame" title="First frame">⏮</button>
                <button class="frame-btn" onclick="prevFrame()" data-i18n-title="viewer.prev_frame" title="Previous frame">◀</button>
                <input type="range" class="frame-slider" id="frame-slider" min="0" max="0" value="0" oninput="onFrameSliderChange()">
                <button class="frame-btn" onclick="nextFrame()" data-i18n-title="viewer.next_frame" title="Next frame">▶</button>
                <button class="frame-btn" onclick="lastFrame()" data-i18n-title="viewer.last_frame" title="Last frame">⏭</button>
                <span class="frame-info" id="frame-info">1 / 1</span>
                <button class="frame-btn" onclick="toggleCineLoop()" id="play-btn" data-i18n-title="viewer.autoplay" title="Autoplay">▶️ <span data-i18n="viewer.play">Play</span></button>
                <div class="speed-control" id="speed-control">
                    <span class="speed-label" data-i18n="viewer.speed">Speed:</span>
                    <input type="range" class="speed-slider" id="speed-slider" min="1" max="30" value="10" oninput="onSpeedChange()">
                    <span class="speed-label" id="fps-label">10 fps</span>
                </div>
            </div>
        </div>

        <div id="status-bar">
            <span id="statusText" data-i18n="viewer.ready">Ready</span>
            <span id="zoomInfo"></span>
            <span id="wl-info"></span>
        </div>
    </div>

    <script>
        // ==================== ПАРАМЕТРЫ ИЗ URL ====================
        const params = new URLSearchParams(window.location.search);
        const TOKEN = params.get('token');
        const FILE_ID = params.get('file_id');
        
        if (!TOKEN || !FILE_ID) {
            showError('Отсутствуют параметры token или file_id');
        }
        
        // ==================== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ====================
        let metadata = {};
        let tool = 'window';
        let dragging = false;
        let dragStart = { x: 0, y: 0 };
        let transform = { scale: 1, tx: 0, ty: 0, invert: false };

        // Window/Level состояние
        let wlState = { wc: 128, ww: 256 };
        let wlStart = { wc: 128, ww: 256 };
        let wlTimeout = null;
        let currentImageUrl = null;

        // Multi-frame состояние
        let totalFrames = 1;
        let currentFrame = 0;
        let isMultiFrame = false;
        let cinePlaying = false;
        let cineInterval = null;
        let cineFps = 10;
        let frameCache = new Map(); // Кэш загруженных фреймов
        let frameLoading = new Set(); // Загружающиеся сейчас фреймы
        let frameLoadingAbort = new Map(); // AbortController для отмены загрузки
        let preloadRadius = 3; // Сколько соседних фреймов предзагружать
        let currentLoadingPromise = null; // Текущий promise загрузкики для race condition
        const FRAME_CACHE_MAX_ITEMS = 100; // Максимальное количество фреймов в кэше
        const FRAME_CACHE_MAX_MEMORY_MB = 200; // Максимальный размер кэша в MB (примерно)
        let frameCacheEstimatedSizeMB = 0; // Приблизительный размер кэша

        // Measurement состояние
        let measurementMode = false;
        let measureTool = null; // 'ruler', 'angle', 'rect', 'ellipse'
        let measurements = []; // Массив всех измерений
        let measureDrawing = false;
        let measurePoints = []; // Текущие точки измерения
        let measureCanvas, measureCtx;
        let pixelSpacing = { x: 1, y: 1 }; // мм на пиксель (из DICOM)
        let measureMouseSetup = false; // Флаг для предотвращения дублирования listeners
        
        // Предустановки Window/Level для разных тканей
        const wlPresets = {
            'Bone': { wc: 500, ww: 2000 },
            'Lung': { wc: -500, ww: 1500 },
            'Brain': { wc: 40, ww: 80 },
            'Abdomen': { wc: 50, ww: 350 },
            'Liver': { wc: 60, ww: 150 }
        };
        
        // DOM элементы
        const img = document.getElementById('dicom-img');
        const loadingDiv = document.getElementById('loading');
        const viewerLayout = document.getElementById('viewer-layout');
        const fileNameSpan = document.getElementById('fileName');
        const fileMetaSpan = document.getElementById('fileMeta');
        const statusTextSpan = document.getElementById('statusText');
        const zoomInfoSpan = document.getElementById('zoomInfo');
        const wlInfoSpan = document.getElementById('wl-info');
        const measureCanvasEl = document.getElementById('measurement-canvas');
        
        // ==================== ОСНОВНАЯ ИНИЦИАЛИЗАЦИЯ ====================
        (async function init() {
            try {
                statusTextSpan.textContent = 'Загрузка метаданных...';

                // 1. Загружаем метаданные
                const metaResp = await fetch(`/api/dicom/metadata/${FILE_ID}?token=${TOKEN}`);
                if (metaResp.ok) {
                    metadata = await metaResp.json();

                    // Загружаем WL/WW из метаданных DICOM, если есть
                    if (metadata.WindowCenter) {
                        wlState.wc = parseFloat(metadata.WindowCenter);
                        wlStart.wc = wlState.wc;
                    }
                    if (metadata.WindowWidth) {
                        wlState.ww = parseFloat(metadata.WindowWidth);
                        wlStart.ww = wlState.ww;
                    }

                    // Проверяем multi-frame
                    totalFrames = parseInt(metadata.NumberOfFrames) || 1;
                    isMultiFrame = totalFrames > 1;

                    if (isMultiFrame) {
                        console.log(`[DICOM] Multi-frame detected: ${totalFrames} frames`);
                        setupMultiFrame();
                    }
                } else {
                    console.warn('Metadata fetch failed:', metaResp.status);
                }

                // Формируем имя файла для отображения
                const fileName = metadata.StudyDescription ||
                                metadata.PatientName ||
                                metadata.Modality ||
                                `DICOM #${FILE_ID}`;

                // 2. Загружаем PNG с бэкенда (с параметрами WL/WW)
                statusTextSpan.textContent = isMultiFrame ? 
                    `Загрузка изображения (1/${totalFrames})...` : 
                    'Загрузка изображения...';
                await loadFrame(0);

                // Функция-обработчик загрузки изображения (объявлена заранее)
                function onImgLoad() {
                    loadingDiv.style.display = 'none';
                    viewerLayout.style.display = 'flex';
                    fileNameSpan.textContent = fileName;
                    fileMetaSpan.textContent = `${img.naturalWidth}×${img.naturalHeight} | ${metadata.Modality || 'DICOM'}${isMultiFrame ? ` | ${totalFrames} fr` : ''}`;
                    updateZoomInfo();
                    updateWlInfo();
                    setupMouse();
                    renderMetadata();
                    initMeasurementCanvas();
                    statusTextSpan.textContent = 'Готово';

                    // Предзагрузка соседних фреймов для multi-frame
                    if (isMultiFrame) {
                        preloadNeighborFrames();
                    }
                }

                img.addEventListener('load', onImgLoad, { once: true });

                img.onerror = function() {
                    showError('Не удалось загрузить изображение DICOM. Проверьте, что файл является DICOM и сервер доступен.');
                };

            } catch (e) {
                console.error('Init error:', e);
                showError(e.message);
            }
        })();
        
        // ==================== МЫШЬ + POINTER (тач-экраны) + PINCH ZOOM ====================
        let _dragPointerId = null;
        function setupMouse() {
            const onPointerDown = (e) => {
                if (measurementMode) return;
                if (e.button !== 0) return;
                e.preventDefault();
                try { img.setPointerCapture(e.pointerId); } catch (err) { /* no-op */ }
                _dragPointerId = e.pointerId;
                dragging = true;
                dragStart = { x: e.clientX, y: e.clientY };
                if (tool === 'window') {
                    wlStart = { wc: wlState.wc, ww: wlState.ww };
                    img.style.cursor = 'ew-resize';
                } else if (tool === 'pan') {
                    img.style.cursor = 'grabbing';
                } else {
                    img.style.cursor = 'default';
                }
            };
            const onPointerMove = (e) => {
                if (measurementMode) return;
                if (!dragging || e.pointerId !== _dragPointerId) return;
                e.preventDefault();
                const dx = e.clientX - dragStart.x;
                const dy = e.clientY - dragStart.y;
                if (tool === 'window') {
                    wlState.ww = Math.max(1, wlStart.ww + dx);
                    wlState.wc = wlStart.wc + dy;
                    updateWindowLevel();
                } else if (tool === 'zoom') {
                    transform.scale = Math.max(0.1, Math.min(20, transform.scale * (1 + dy / 200)));
                    applyTransform();
                } else if (tool === 'pan') {
                    transform.tx += dx / transform.scale;
                    transform.ty += dy / transform.scale;
                    applyTransform();
                }
                dragStart = { x: e.clientX, y: e.clientY };
            };
            const endPointerDrag = (e) => {
                if (e.pointerId !== _dragPointerId) return;
                dragging = false;
                _dragPointerId = null;
                if (tool === 'window') {
                    img.style.cursor = 'ew-resize';
                } else if (tool === 'pan') {
                    img.style.cursor = 'grab';
                } else {
                    img.style.cursor = 'crosshair';
                }
            };
            img.addEventListener('pointerdown', onPointerDown, { passive: false });
            img.addEventListener('pointermove', onPointerMove, { passive: false });
            img.addEventListener('pointerup', endPointerDrag);
            img.addEventListener('pointercancel', endPointerDrag);
            img.addEventListener('lostpointercapture', endPointerDrag);

            img.addEventListener('wheel', (e) => {
                e.preventDefault();

                if (tool === 'cine' && isMultiFrame) {
                    const delta = e.deltaY > 0 ? 1 : -1;
                    const newFrame = Math.max(0, Math.min(totalFrames - 1, currentFrame + delta));
                    if (newFrame !== currentFrame) {
                        document.getElementById('frame-slider').value = newFrame;
                        statusTextSpan.textContent = `Загрузка кадра ${newFrame + 1}/${totalFrames}...`;
                        img.classList.add('loading');
                        loadFrame(newFrame).then(() => {
                            img.classList.remove('loading');
                            statusTextSpan.textContent = 'Готово';
                            preloadNeighborFrames();
                        });
                    }
                    return;
                }
                if (tool === 'window') {
                    const delta = e.deltaY > 0 ? -5 : 5;
                    wlState.ww = Math.max(1, wlState.ww + delta);
                    updateWindowLevel();
                } else {
                    const delta = e.deltaY > 0 ? 0.9 : 1.1;
                    transform.scale = Math.max(0.1, Math.min(20, transform.scale * delta));
                    applyTransform();
                }
            }, { passive: false });

            img.style.cursor = tool === 'window' ? 'ew-resize' : (tool === 'pan' ? 'grab' : 'crosshair');
            setupPinchZoom();
        }

        function setupPinchZoom() {
            const el = document.getElementById('viewport-container');
            if (!el || el.dataset.smdgPinch) return;
            el.dataset.smdgPinch = '1';
            let p0 = null;
            const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
            el.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    p0 = { d: dist(e.touches[0], e.touches[1]), s0: transform.scale };
                    e.preventDefault();
                } else { p0 = null; }
            }, { passive: false });
            el.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2 && p0) {
                    e.preventDefault();
                    const d = dist(e.touches[0], e.touches[1]);
                    const ratio = d / p0.d;
                    transform.scale = Math.max(0.1, Math.min(20, p0.s0 * ratio));
                    applyTransform();
                }
            }, { passive: false });
            el.addEventListener('touchend', () => { p0 = null; });
        }
        
        // ==================== ПРИМЕНЕНИЕ ТРАНСФОРМАЦИЙ ====================
        function applyTransform() {
            img.style.transform = `scale(${transform.scale}) translate(${transform.tx}px, ${transform.ty}px)`;
            img.style.transformOrigin = 'center center';
            updateZoomInfo();
            // Перерисовываем измерения при изменении zoom/pan
            redrawMeasurements();
        }
        
        function updateZoomInfo() {
            zoomInfoSpan.textContent = `Масштаб: ${Math.round(transform.scale * 100)}%`;
        }
        
        function updateWlInfo() {
            wlInfoSpan.textContent = `WL: ${Math.round(wlState.wc)} / WW: ${Math.round(wlState.ww)}`;
        }
        
        // ==================== WINDOW/LEVEL ОБНОВЛЕНИЕ ====================
        function updateWindowLevel() {
            if (wlTimeout) clearTimeout(wlTimeout);
            
            // Показываем индикатор загрузки
            img.classList.add('loading');
            updateWlInfo();
            statusTextSpan.textContent = `Применение WL/WW: ${Math.round(wlState.wc)} / ${Math.round(wlState.ww)}`;
            
            wlTimeout = setTimeout(() => {
                const url = `/api/dicom/render/${FILE_ID}?token=${TOKEN}&center=${wlState.wc}&width=${wlState.ww}`;

                // Сохраняем текущие трансформации перед загрузкой нового изображения
                const savedTransform = { ...transform };

                // Используем addEventListener вместо перезаписи onload
                const onWlLoad = () => {
                    img.removeEventListener('load', onWlLoad);
                    img.classList.remove('loading');
                    statusTextSpan.textContent = 'Готово';
                    // Восстанавливаем трансформации после загрузки
                    transform = savedTransform;
                    applyTransform();
                };

                img.addEventListener('load', onWlLoad, { once: true });
                
                img.onerror = () => {
                    img.classList.remove('loading');
                    statusTextSpan.textContent = 'Ошибка обновления WL/WW';
                };
                
                img.src = url;
                currentImageUrl = url;
            }, 80);
        }
        
        // ==================== ПРЕДУСТАНОВКИ WL/WW ====================
        function setPreset(presetName) {
            const preset = wlPresets[presetName];
            if (preset) {
                wlState.wc = preset.wc;
                wlState.ww = preset.ww;
                updateWindowLevel();
                statusTextSpan.textContent = `Предустановка: ${presetName}`;
                setTimeout(() => {
                    if (statusTextSpan.textContent === `Предустановка: ${presetName}`) {
                        statusTextSpan.textContent = 'Готово';
                    }
                }, 1500);
            }
        }
        
        // ==================== ИНСТРУМЕНТЫ ====================
        function setTool(t) {
            tool = t;
            // Обновляем активные классы кнопок
            document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tool === t);
            });
            // Обновляем курсор
            if (t === 'window') {
                img.classList.remove('tool-pan');
                img.classList.add('tool-window');
                img.style.cursor = 'ew-resize';
            } else if (t === 'pan') {
                img.classList.remove('tool-window');
                img.classList.add('tool-pan');
                img.style.cursor = 'grab';
            } else if (t === 'cine') {
                img.classList.remove('tool-window', 'tool-pan');
                img.style.cursor = 'default';
                statusTextSpan.textContent = 'Cine mode: используйте scroll для навигации по кадрам';
            } else {
                img.classList.remove('tool-window', 'tool-pan');
                img.style.cursor = 'crosshair';
            }
            if (t !== 'cine') {
                statusTextSpan.textContent = `Инструмент: ${t === 'window' ? 'Окно (WL/WW)' : (t === 'zoom' ? 'Зум' : 'Пан')}`;
            }
            setTimeout(() => {
                const currentText = statusTextSpan.textContent;
                if (currentText.startsWith('Инструмент:') || currentText === 'Cine mode: используйте scroll для навигации по кадрам') {
                    statusTextSpan.textContent = 'Готово';
                }
            }, 1500);
        }
        
        function zoomStepIn() {
            transform.scale = Math.max(0.1, Math.min(20, transform.scale * 1.2));
            applyTransform();
            statusTextSpan.textContent = 'Масштаб: +';
        }
        function zoomStepOut() {
            transform.scale = Math.max(0.1, Math.min(20, transform.scale / 1.2));
            applyTransform();
            statusTextSpan.textContent = 'Масштаб: −';
        }
        function toggleDicomMainToolbar() {
            const t = document.getElementById('toolbar');
            const btn = document.getElementById('dicomToolbarToggle');
            if (!t) return;
            const collapsed = t.classList.toggle('dicom-toolbar--collapsed');
            if (btn) {
                btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
            }
        }
        function resetView() {
            transform = { scale: 1, tx: 0, ty: 0, invert: false };
            img.style.filter = '';
            img.classList.remove('loading');
            applyTransform();

            // Останавливаем cine если играет
            if (cinePlaying) {
                toggleCineLoop();
            }

            // Очищаем измерения
            clearMeasurements();

            statusTextSpan.textContent = 'Вид сброшен';
            setTimeout(() => {
                if (statusTextSpan.textContent === 'Вид сброшен') {
                    statusTextSpan.textContent = 'Готово';
                }
            }, 1000);
        }
        
        function invertView() {
            transform.invert = !transform.invert;
            img.style.filter = transform.invert ? 'invert(1)' : '';
            statusTextSpan.textContent = transform.invert ? 'Инвертировано' : 'Нормальное отображение';
        }
        
        // ==================== МЕТАДАННЫЕ ====================
        function toggleMetadata() {
            const p = document.getElementById('metadata-panel');
            const b = document.getElementById('metadata-backdrop');
            if (!p) return;
            p.classList.toggle('show');
            const open = p.classList.contains('show');
            if (b) {
                if (window.innerWidth < 768 && open) {
                    b.hidden = false;
                    b.classList.add('is-visible');
                } else {
                    b.hidden = true;

                }
            }
        }
        function _closeDicomMetadata() {
            const p = document.getElementById('metadata-panel');
            const b = document.getElementById('metadata-backdrop');
            if (p) p.classList.remove('show');
            if (b) {
                b.hidden = true;
                b.classList.remove('is-visible');
            }
        }
        window._closeDicomMetadata = _closeDicomMetadata;
        
        function renderMetadata() {
            const groups = {
                'Пациент': ['PatientName', 'PatientID', 'PatientBirthDate', 'PatientSex'],
                'Исследование': ['StudyDate', 'StudyTime', 'StudyDescription', 'StudyInstanceUID', 'AccessionNumber', 'ReferringPhysicianName'],
                'Серия': ['Modality', 'SeriesDescription', 'SeriesNumber', 'SeriesInstanceUID', 'SeriesDate'],
                'Изображение': ['Rows', 'Columns', 'BitsAllocated', 'BitsStored', 'HighBit', 'PixelRepresentation', 'SamplesPerPixel', 'PhotometricInterpretation', 'NumberOfFrames', 'PixelSpacing', 'SliceThickness'],
                'Сжатие': ['TransferSyntaxName', 'TransferSyntaxUID'],
                'Окно/Уровень': ['WindowCenter', 'WindowWidth', 'RescaleIntercept', 'RescaleSlope'],
                'Оборудование': ['Manufacturer', 'ManufacturerModelName', 'InstitutionName', 'StationName', 'SoftwareVersions']
            };
            
            let html = '';
            for (const [groupName, fields] of Object.entries(groups)) {
                const presentFields = fields.filter(f => metadata[f] !== undefined && metadata[f] !== '');
                if (presentFields.length === 0) continue;
                
                html += `<h4>${groupName}</h4>`;
                for (const field of presentFields) {
                    let value = metadata[field];
                    // Сокращаем длинные UID для отображения
                    if (field.endsWith('UID') && value && value.length > 40) {
                        const shortValue = value.substring(0, 35) + '…';
                        html += `<div class="row">
                                    <span class="label">${field}</span>
                                    <span class="value" title="${escapeHtml(String(value))}">${escapeHtml(shortValue)}</span>
                                </div>`;
                    } else {
                        html += `<div class="row">
                                    <span class="label">${field}</span>
                                    <span class="value">${escapeHtml(String(value))}</span>
                                </div>`;
                    }
                }
            }
            
            document.getElementById('metadata-panel').innerHTML = html || '<p style="color:#888; text-align:center;">Нет метаданных</p>';
        }
        
        // ==================== ФУНКЦИИ ИЗМЕРЕНИЙ ====================

        // Преобразование координат изображения (image-space) в canvas-координаты (с учётом zoom/pan)
        function getImageToCanvasCoordinates(imgX, imgY) {
            const canvasRect = measureCanvas.getBoundingClientRect();
            const imgRect = img.getBoundingClientRect();

            // Нормализуем к относительным координатам изображения (0..1)
            const normX = imgX / img.naturalWidth;
            const normY = imgY / img.naturalHeight;

            // Преобразуем в пиксели отображаемого изображения
            const displayedX = normX * imgRect.width;
            const displayedY = normY * imgRect.height;

            // Добавляем смещение изображения относительно canvas и трансформации
            const canvasX = (imgRect.left - canvasRect.left) + displayedX + transform.tx * transform.scale;
            const canvasY = (imgRect.top - canvasRect.top) + displayedY + transform.ty * transform.scale;

            return { x: canvasX, y: canvasY };
        }

        // Преобразование client координат (клик мыши) в координаты изображения (image-space)
        function getImageCoordinates(clientX, clientY) {
            const canvasRect = measureCanvas.getBoundingClientRect();
            const imgRect = img.getBoundingClientRect();

            // Позиция клика относительно canvas
            const canvasX = clientX - canvasRect.left;
            const canvasY = clientY - canvasRect.top;

            // Позиция изображения относительно canvas
            const imgOffsetX = imgRect.left - canvasRect.left;
            const imgOffsetY = imgRect.top - canvasRect.top;

            // Координаты относительно изображения
            const relX = canvasX - imgOffsetX;
            const relY = canvasY - imgOffsetY;

            // Обратное преобразование масштава и панорамирования
            const imgX = (relX - transform.tx * transform.scale) / transform.scale;
            const imgY = (relY - transform.ty * transform.scale) / transform.scale;

            // Нормализуем к натуральному размеру изображения
            const normX = (imgX / imgRect.width) * img.naturalWidth;
            const normY = (imgY / imgRect.height) * img.naturalHeight;

            return { x: normX, y: normY };
        }

        function initMeasurementCanvas() {
            measureCanvas = measureCanvasEl;
            measureCtx = measureCanvas.getContext('2d');

            // Инициализация Pixel Spacing из DICOM
            if (metadata.PixelSpacing) {
                const spacing = metadata.PixelSpacing.split('\\').map(parseFloat);
                if (spacing.length === 2 && spacing[0] > 0 && spacing[1] > 0) {
                    pixelSpacing = { x: spacing[0], y: spacing[1] };
                }
            }

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
        }

        function resizeCanvas() {
            const container = document.getElementById('viewport-container');
            measureCanvas.width = container.offsetWidth;
            measureCanvas.height = container.offsetHeight;
            redrawMeasurements();
        }

        function toggleMeasurementMode() {
            measurementMode = !measurementMode;
            const measureBtn = document.getElementById('measure-btn');
            const measureToolbar = document.getElementById('measure-toolbar');

            if (measurementMode) {
                measureBtn.classList.add('active');
                measureToolbar.classList.add('show');
                img.classList.add('tool-measure');
                measureCanvas.style.pointerEvents = 'auto';
                setupMeasureMouse();
                statusTextSpan.textContent = 'Режим измерений: выберите инструмент';
            } else {
                measureBtn.classList.remove('active');
                measureToolbar.classList.remove('show');
                img.classList.remove('tool-measure');
                measureCanvas.style.pointerEvents = 'none';
                measureTool = null;
                measureDrawing = false;
                measurePoints = [];
                document.querySelectorAll('.measure-btn[data-measure]').forEach(btn => {
                    btn.classList.remove('active');
                });
                // Удаляем listeners при выходе из режима
                measureCanvas.removeEventListener('mousedown', handleMeasureMouseDown);
                measureCanvas.removeEventListener('mousemove', handleMeasureMouseMove);
                measureMouseSetup = false;
                redrawMeasurements();
                statusTextSpan.textContent = 'Режим измерений выключен';
            }
        }

        function setMeasureTool(tool) {
            measureTool = tool;
            measureDrawing = false;
            measurePoints = [];

            // Обновляем активные классы
            document.querySelectorAll('.measure-btn[data-measure]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.measure === tool);
            });

            const toolNames = {
                'ruler': 'Линейка: кликните 2 точки',
                'angle': 'Угол: кликните 3 точки',
                'rect': 'ROI Rectangle: кликните 2 угла',
                'ellipse': 'ROI Ellipse: кликните центр, затем край'
            };
            statusTextSpan.textContent = toolNames[tool] || 'Выберите инструмент';
        }

        function setupMeasureMouse() {
            // Предотвращаем дублирование listeners
            if (measureMouseSetup) return;
            measureMouseSetup = true;

            // measurement mode — используем отдельный overlay для кликов
            measureCanvas.style.pointerEvents = 'auto';

            measureCanvas.addEventListener('mousedown', handleMeasureMouseDown);
            measureCanvas.addEventListener('mousemove', handleMeasureMouseMove);
        }

        function handleMeasureMouseDown(e) {
            if (!measurementMode || !measureTool) return;
            if (e.button !== 0) return;

            // Используем image-space координаты для точности
            const imgCoords = getImageCoordinates(e.clientX, e.clientY);

            if (!measureDrawing) {
                measureDrawing = true;
                // Храним ТОЛЬКО image-space координаты
                measurePoints = [{ imgX: imgCoords.x, imgY: imgCoords.y }];
                statusTextSpan.textContent = measureTool === 'angle' ? `Точка 2 (вершина)...` : `Точка 2...`;
            } else {
                // Добавляем image-space координаты
                measurePoints.push({ imgX: imgCoords.x, imgY: imgCoords.y });

                // Проверяем, завершено ли измерение
                if (measureTool === 'ruler' && measurePoints.length === 2) {
                    finishMeasurement('ruler');
                } else if (measureTool === 'angle' && measurePoints.length === 3) {
                    finishMeasurement('angle');
                } else if ((measureTool === 'rect' || measureTool === 'ellipse') && measurePoints.length === 2) {
                    finishMeasurement(measureTool);
                } else if (measureTool === 'angle' && measurePoints.length === 2) {
                    statusTextSpan.textContent = `Точка 3...`;
                } else {
                    statusTextSpan.textContent = `Точка ${measurePoints.length + 1}...`;
                }
            }

            e.preventDefault();
            e.stopPropagation();
        }

        function handleMeasureMouseMove(e) {
            if (!measureDrawing || measurePoints.length === 0) return;

            // Получаем client координаты и конвертируем в image-space для preview
            const imgCoords = getImageCoordinates(e.clientX, e.clientY);
            
            // Получаем canvas координаты последнего сохранённого пункта
            const lastPoint = measurePoints[measurePoints.length - 1];
            const lastCanvasCoords = getImageToCanvasCoordinates(lastPoint.imgX, lastPoint.imgY);
            
            // Получаем canvas координаты текущей позиции
            const currentCanvasCoords = getImageToCanvasCoordinates(imgCoords.x, imgCoords.y);

            redrawMeasurements();
            drawPreview(lastCanvasCoords, currentCanvasCoords);

            e.preventDefault();
            e.stopPropagation();
        }

        function finishMeasurement(type) {
            const measurement = {
                type,
                points: [...measurePoints],
                timestamp: new Date().toISOString()
            };

            // Вычисляем результат используя координаты изображения (imgX/imgY) для точности
            if (type === 'ruler') {
                const p1 = measurement.points[0];
                const p2 = measurement.points[1];
                const dx = (p2.imgX - p1.imgX) * pixelSpacing.x;
                const dy = (p2.imgY - p1.imgY) * pixelSpacing.y;
                measurement.distance = Math.sqrt(dx * dx + dy * dy);
                measurement.unit = 'mm';
            } else if (type === 'angle') {
                const p1 = measurement.points[0];
                const p2 = measurement.points[1];
                const p3 = measurement.points[2];
                // Используем imgX/imgY для точного вычисления угла
                const angle = calculateAngle(
                    { x: p1.imgX, y: p1.imgY },
                    { x: p2.imgX, y: p2.imgY },
                    { x: p3.imgX, y: p3.imgY }
                );
                measurement.angle = angle;
                measurement.unit = '°';
            } else if (type === 'rect') {
                const p1 = measurement.points[0];
                const p2 = measurement.points[1];
                const width = Math.abs(p2.imgX - p1.imgX) * pixelSpacing.x;
                const height = Math.abs(p2.imgY - p1.imgY) * pixelSpacing.y;
                measurement.width = width;
                measurement.height = height;
                measurement.area = width * height;
                measurement.unit = 'mm';
            } else if (type === 'ellipse') {
                const p1 = measurement.points[0];
                const p2 = measurement.points[1];
                const rx = Math.abs(p2.imgX - p1.imgX) * pixelSpacing.x;
                const ry = Math.abs(p2.imgY - p1.imgY) * pixelSpacing.y;
                measurement.radiusX = rx;
                measurement.radiusY = ry;
                measurement.area = Math.PI * rx * ry;
                measurement.unit = 'mm';
            }

            measurements.push(measurement);
            measureDrawing = false;
            measurePoints = [];

            redrawMeasurements();
            updateMeasureResults();
            statusTextSpan.textContent = 'Измерение добавлено';
            setTimeout(() => {
                if (statusTextSpan.textContent === 'Измерение добавлено') {
                    statusTextSpan.textContent = 'Готово';
                }
            }, 1500);
        }

        function calculateAngle(p1, p2, p3) {
            // p2 - вершина угла
            const v1 = { x: p1.x - p2.x, y: p1.y - p2.y };
            const v2 = { x: p3.x - p2.x, y: p3.y - p2.y };

            const dot = v1.x * v2.x + v1.y * v2.y;
            const mag1 = Math.sqrt(v1.x * v1.x + v1.y * v1.y);
            const mag2 = Math.sqrt(v2.x * v2.x + v2.y * v2.y);

            if (mag1 < 0.001 || mag2 < 0.001) {
                return 0; // Точки слишком близки
            }

            const cos = dot / (mag1 * mag2);
            const angle = Math.acos(Math.max(-1, Math.min(1, cos)));
            return angle * (180 / Math.PI); // в градусы
        }

        function drawPreview(p1, p2) {
            measureCtx.strokeStyle = '#6ea8fe';
            measureCtx.lineWidth = 2;
            measureCtx.setLineDash([5, 5]);

            if (measureTool === 'ruler') {
                measureCtx.beginPath();
                measureCtx.moveTo(p1.x, p1.y);
                measureCtx.lineTo(p2.x, p2.y);
                measureCtx.stroke();
            } else if (measureTool === 'angle') {
                if (measurePoints.length === 1) {
                    // Первая линия: точка 1 → текущая
                    measureCtx.beginPath();
                    measureCtx.moveTo(p1.x, p1.y);
                    measureCtx.lineTo(p2.x, p2.y);
                    measureCtx.stroke();
                } else if (measurePoints.length === 2) {
                    // Две линии: 1→2 и 2→текущая
                    const p2canvas = getImageToCanvasCoordinates(measurePoints[1].imgX, measurePoints[1].imgY);
                    measureCtx.beginPath();
                    measureCtx.moveTo(p1.x, p1.y);
                    measureCtx.lineTo(p2canvas.x, p2canvas.y);
                    measureCtx.lineTo(p2.x, p2.y);
                    measureCtx.stroke();
                }
            } else if (measureTool === 'rect') {
                const x = Math.min(p1.x, p2.x);
                const y = Math.min(p1.y, p2.y);
                const w = Math.abs(p2.x - p1.x);
                const h = Math.abs(p2.y - p1.y);
                measureCtx.strokeRect(x, y, w, h);
            } else if (measureTool === 'ellipse') {
                const rx = Math.abs(p2.x - p1.x);
                const ry = Math.abs(p2.y - p1.y);
                measureCtx.beginPath();
                measureCtx.ellipse(p1.x, p1.y, rx, ry, 0, 0, 2 * Math.PI);
                measureCtx.stroke();
            }

            measureCtx.setLineDash([]);
        }

        function redrawMeasurements() {
            if (!measureCtx) return;

            measureCtx.clearRect(0, 0, measureCanvas.width, measureCanvas.height);

            measurements.forEach((m, idx) => {
                const colors = {
                    'ruler': '#3fb950',
                    'angle': '#d29922',
                    'rect': '#f778ba',
                    'ellipse': '#f778ba'
                };
                measureCtx.strokeStyle = colors[m.type] || '#6ea8fe';
                measureCtx.fillStyle = colors[m.type] || '#6ea8fe';
                measureCtx.lineWidth = 2;
                measureCtx.setLineDash([]);

                // Конвертируем все точки из image-space в canvas
                const canvasPoints = m.points.map(p => getImageToCanvasCoordinates(p.imgX, p.imgY));

                if (m.type === 'ruler') {
                    measureCtx.beginPath();
                    measureCtx.moveTo(canvasPoints[0].x, canvasPoints[0].y);
                    measureCtx.lineTo(canvasPoints[1].x, canvasPoints[1].y);
                    measureCtx.stroke();

                    // Точки
                    canvasPoints.forEach(p => {
                        measureCtx.beginPath();
                        measureCtx.arc(p.x, p.y, 4, 0, 2 * Math.PI);
                        measureCtx.fill();
                    });

                    // Текст
                    const midX = (canvasPoints[0].x + canvasPoints[1].x) / 2;
                    const midY = (canvasPoints[0].y + canvasPoints[1].y) / 2;
                    drawText(`${m.distance.toFixed(2)} ${m.unit}`, midX, midY - 10);

                } else if (m.type === 'angle') {
                    measureCtx.beginPath();
                    measureCtx.moveTo(canvasPoints[0].x, canvasPoints[0].y);
                    measureCtx.lineTo(canvasPoints[1].x, canvasPoints[1].y);
                    measureCtx.lineTo(canvasPoints[2].x, canvasPoints[2].y);
                    measureCtx.stroke();

                    // Точки
                    canvasPoints.forEach(p => {
                        measureCtx.beginPath();
                        measureCtx.arc(p.x, p.y, 4, 0, 2 * Math.PI);
                        measureCtx.fill();
                    });

                    // Текст
                    drawText(`${m.angle.toFixed(1)}°`, canvasPoints[1].x + 10, canvasPoints[1].y - 10);

                } else if (m.type === 'rect') {
                    const x = Math.min(canvasPoints[0].x, canvasPoints[1].x);
                    const y = Math.min(canvasPoints[0].y, canvasPoints[1].y);
                    const w = Math.abs(canvasPoints[1].x - canvasPoints[0].x);
                    const h = Math.abs(canvasPoints[1].y - canvasPoints[0].y);
                    measureCtx.strokeRect(x, y, w, h);

                    // Текст
                    drawText(`${m.width.toFixed(1)}×${m.height.toFixed(1)} mm`, x + w / 2, y - 5);
                    drawText(`S=${m.area.toFixed(1)} mm²`, x + w / 2, y + h + 15);

                } else if (m.type === 'ellipse') {
                    const rx = Math.abs(canvasPoints[1].x - canvasPoints[0].x);
                    const ry = Math.abs(canvasPoints[1].y - canvasPoints[0].y);
                    measureCtx.beginPath();
                    measureCtx.ellipse(canvasPoints[0].x, canvasPoints[0].y, rx, ry, 0, 0, 2 * Math.PI);
                    measureCtx.stroke();

                    // Текст
                    drawText(`Rx=${m.radiusX.toFixed(1)}, Ry=${m.radiusY.toFixed(1)}`, canvasPoints[0].x + rx + 5, canvasPoints[0].y);
                    drawText(`S=${m.area.toFixed(1)} mm²`, canvasPoints[0].x + rx + 5, canvasPoints[0].y + 15);
                }
            });
        }

        function drawText(text, x, y) {
            measureCtx.font = 'bold 12px monospace';
            measureCtx.fillStyle = '#ffffff';
            measureCtx.strokeStyle = '#000000';
            measureCtx.lineWidth = 3;

            const metrics = measureCtx.measureText(text);
            const padding = 4;
            const bgX = x - padding;
            const bgY = y - 12 - padding;
            const bgW = metrics.width + padding * 2;
            const bgH = 24 + padding * 2;

            measureCtx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            measureCtx.fillRect(bgX, bgY, bgW, bgH);

            measureCtx.fillStyle = '#ffffff';
            measureCtx.fillText(text, x, y);
        }

        function updateMeasureResults() {
            const panel = document.getElementById('measure-results');

                panel.innerHTML = '<h4>📐 Измерения</h4><p style="color:#888;">Нет измерений</p>';

            let html = '<h4>📐 Измерения</h4>';
            measurements.forEach((m, idx) => {
                html += `<div class="measure-item">`;

                if (m.type === 'ruler') {

                } else if (m.type === 'angle') {
                    html += `<div class="measure-value angle">Угол: ${m.angle.toFixed(1)}${m.unit}</div>`;
                } else if (m.type === 'rect') {
                    html += `<div class="measure-value roi">Ширина: ${m.width.toFixed(2)} ${m.unit}</div>`;
                    html += `<div class="measure-value roi">Высота: ${m.height.toFixed(2)} ${m.unit}</div>`;
                    html += `<div class="measure-value roi">Площадь: ${m.area.toFixed(2)} ${m.unit}²</div>`;
                } else if (m.type === 'ellipse') {
                    html += `<div class="measure-value roi">Rx: ${m.radiusX.toFixed(2)} ${m.unit}</div>`;
                    html += `<div class="measure-value roi">Ry: ${m.radiusY.toFixed(2)} ${m.unit}</div>`;
                    html += `<div class="measure-value roi">Площадь: ${m.area.toFixed(2)} ${m.unit}²</div>`;
                }

                html += `</div>`;

        function getMeasureTypeName(type) {

                'ruler': 'Линейка',

        // ==================== MULTI-FRAME ФУНКЦИИ ====================
        function setupMultiFrame() {
            // Показываем Cine кнопку
            document.getElementById('cine-btn').style.display = 'inline-block';

            // Показываем frame control
            const frameControl = document.getElementById('frame-control');
            frameControl.classList.add('show');

            // Настраиваем слайдер
            const slider = document.getElementById('frame-slider');
            slider.min = 0;
            slider.max = totalFrames - 1;
            slider.value = 0;

            updateFrameInfo();
        }

        function loadFrame(frameNumber) {
            return new Promise((resolve, reject) => {
                if (frameNumber < 0 || frameNumber >= totalFrames) {
                    reject(new Error(`Frame ${frameNumber} out of range`));
                    return;
                }

                // Создаём уникальный ID для этой загрузки
                const loadingId = `frame_${frameNumber}_${Date.now()}`;

                // Проверяем кэш
                const cacheKey = `${frameNumber}:${wlState.wc}:${wlState.ww}`;
                if (frameCache.has(cacheKey)) {
                    const cachedUrl = frameCache.get(cacheKey);
                    img.src = cachedUrl;
                    currentFrame = frameNumber;
                    updateFrameInfo();
                    resolve();
                    return;
                }

                // Отменяем предыдущую загрузку этого же фрейма если есть
                if (frameLoadingAbort.has(cacheKey)) {
                    frameLoadingAbort.get(cacheKey)();
                    frameLoadingAbort.delete(cacheKey);
                    frameLoading.delete(cacheKey);
                }

                const abortController = { aborted: false };
                const abort = () => { abortController.aborted = true; };
                frameLoadingAbort.set(cacheKey, abort);
                frameLoading.add(cacheKey);

                const url = `/api/dicom/render/${FILE_ID}?token=${TOKEN}&frame=${frameNumber}&center=${wlState.wc}&width=${wlState.ww}`;

                const tempImg = new Image();
                tempImg.onload = () => {
                    // Проверяем, что загрузка не была отменена
                    if (abortController.aborted) {
                        reject(new Error('Load aborted'));
                        return;
                    }

                    frameCache.set(cacheKey, url);
                    frameLoading.delete(cacheKey);
                    frameLoadingAbort.delete(cacheKey);

                    img.src = url;
                    currentImageUrl = url;
                    currentFrame = frameNumber;
                    updateFrameInfo();

                    // Обновляем слайдер
                    document.getElementById('frame-slider').value = frameNumber;

                    resolve();
                };

                tempImg.onerror = () => {
                    frameLoading.delete(cacheKey);
                    frameLoadingAbort.delete(cacheKey);
                    reject(new Error(`Failed to load frame ${frameNumber}`));
                };

                tempImg.src = url;
            });
        }

        function onFrameSliderChange() {
            const slider = document.getElementById('frame-slider');
            const newFrame = parseInt(slider.value);
            if (newFrame !== currentFrame) {
                // Отменяем текущую загрузку если есть
                if (currentLoadingPromise) {
                    // Новая загрузка отменит предыдущую через frameLoadingAbort
                }

                statusTextSpan.textContent = `Загрузка кадра ${newFrame + 1}/${totalFrames}...`;
                img.classList.add('loading');

                const loadPromise = loadFrame(newFrame);
                currentLoadingPromise = loadPromise;

                loadPromise.then(() => {
                    // Проверяем, что это всё ещё актуальная загрузка
                    if (currentLoadingPromise === loadPromise) {
                        img.classList.remove('loading');
                        statusTextSpan.textContent = 'Готово';
                        preloadNeighborFrames();
                        currentLoadingPromise = null;
                    }
                }).catch(err => {
                    if (err.message === 'Load aborted') return; // Игнорируем отменённые
                    console.error('Frame load error:', err);
                    if (currentLoadingPromise === loadPromise) {
                        img.classList.remove('loading');
                        statusTextSpan.textContent = 'Ошибка загрузки кадра';
                        currentLoadingPromise = null;
                    }
                });
            }
        }

        function firstFrame() {
            document.getElementById('frame-slider').value = 0;
            onFrameSliderChange();
        }

        function prevFrame() {
            const slider = document.getElementById('frame-slider');
            slider.value = Math.max(0, parseInt(slider.value) - 1);
            onFrameSliderChange();
        }

        function nextFrame() {
            const slider = document.getElementById('frame-slider');
            slider.value = Math.min(totalFrames - 1, parseInt(slider.value) + 1);
            onFrameSliderChange();
        }

        function lastFrame() {
            const slider = document.getElementById('frame-slider');
            slider.value = totalFrames - 1;
            onFrameSliderChange();
        }

        function updateFrameInfo() {
            const frameInfo = document.getElementById('frame-info');
            frameInfo.textContent = `${currentFrame + 1} / ${totalFrames}`;
        }

        function toggleCineLoop() {
            const playBtn = document.getElementById('play-btn');
            const speedControl = document.getElementById('speed-control');

            if (cinePlaying) {
                // Останавливаем
                cinePlaying = false;
                clearInterval(cineInterval);
                playBtn.textContent = '▶️ Play';
                playBtn.classList.remove('active');
                speedControl.classList.remove('show');
                statusTextSpan.textContent = 'Cine остановлен';
            } else {
                // Запускаем
                cinePlaying = true;
                playBtn.textContent = '⏸ Pause';
                playBtn.classList.add('active');
                speedControl.classList.add('show');
                statusTextSpan.textContent = `Cine playing @ ${cineFps} fps`;

                cineInterval = setInterval(() => {
                    const next = (currentFrame + 1) % totalFrames;
                    document.getElementById('frame-slider').value = next;

                    img.classList.add('loading');
                    loadFrame(next).then(() => {
                        img.classList.remove('loading');
                    });
                }, 1000 / cineFps);
            }
        }

        function onSpeedChange() {
            const slider = document.getElementById('speed-slider');
            cineFps = parseInt(slider.value);
            document.getElementById('fps-label').textContent = `${cineFps} fps`;

            // Перезапускаем с новой скоростью
            if (cinePlaying) {
                clearInterval(cineInterval);
                cineInterval = setInterval(() => {
                    const next = (currentFrame + 1) % totalFrames;
                    document.getElementById('frame-slider').value = next;

                    img.classList.add('loading');
                    loadFrame(next).then(() => {
                        img.classList.remove('loading');
                    });
                }, 1000 / cineFps);

                statusTextSpan.textContent = `Cine playing @ ${cineFps} fps`;
            }
        }

        function preloadNeighborFrames() {
            if (!isMultiFrame) return;

            // Предзагружаем фреймы в радиусе preloadRadius
            const start = Math.max(0, currentFrame - preloadRadius);
            const end = Math.min(totalFrames - 1, currentFrame + preloadRadius);

            for (let i = start; i <= end; i++) {
                if (i === currentFrame) continue;

                const cacheKey = `${i}:${wlState.wc}:${wlState.ww}`;
                if (!frameCache.has(cacheKey) && !frameLoading.has(cacheKey)) {
                    // Тихая предзагрузка без блокировки
                    preloadFrame(i);
                }
            }
        }

        function preloadFrame(frameNumber) {
            const url = `/api/dicom/render/${FILE_ID}?token=${TOKEN}&frame=${frameNumber}&center=${wlState.wc}&width=${wlState.ww}`;
            const cacheKey = `${frameNumber}:${wlState.wc}:${wlState.ww}`;

            frameLoading.add(cacheKey);

            const tempImg = new Image();
            tempImg.onload = () => {
                frameCache.set(cacheKey, tempImg.src);  // FIX: используем tempImg.src вместо url
                frameLoading.delete(cacheKey);
                console.log(`[DICOM] Preloaded frame ${frameNumber + 1}/${totalFrames} (cache size: ${frameCache.size})`);

                // Ограничиваем размер кэша (LRU)
                enforceFrameCacheLimit();
            };
            tempImg.onerror = () => {
                frameLoading.delete(cacheKey);
                console.warn(`[DICOM] Failed to preload frame ${frameNumber + 1}`);
            };
            tempImg.src = url;
        }

        // Ограничение кэша по количеству элементов (LRU стратегия)
        function enforceFrameCacheLimit() {
            // Удаляем самые старые записи если превышен лимит
            while (frameCache.size > FRAME_CACHE_MAX_ITEMS) {
                const firstKey = frameCache.keys().next().value;
                frameCache.delete(firstKey);
            }
        }

        // Полная очистка кэша (при смене WL/WW или закрытии)
        function clearFrameCache() {
            frameCache.clear();
            frameLoadingAbort.forEach(abort => abort());
            frameLoadingAbort.clear();
            frameLoading.clear();
            frameCacheEstimatedSizeMB = 0;
        }

        // ==================== СКРИНШОТ ====================
        async function takeScreenshot() {
            try {
                statusTextSpan.textContent = 'Подготовка скриншота...';

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                // Размер = размер viewport
                const viewport = document.getElementById('viewport-container');
                canvas.width = viewport.offsetWidth;
                canvas.height = viewport.offsetHeight;

                // Фон — чёрный
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Рисуем изображение с учётом трансформаций
                const imgRect = img.getBoundingClientRect();
                const viewportRect = viewport.getBoundingClientRect();

                const x = imgRect.left - viewportRect.left;
                const y = imgRect.top - viewportRect.top;
                const w = imgRect.width;
                const h = imgRect.height;

                // Применяем трансформации
                ctx.save();
                if (transform.invert) {
                    ctx.filter = 'invert(1)';
                }
                ctx.translate(x + w / 2, y + h / 2);
                ctx.scale(transform.scale, transform.scale);
                ctx.translate(transform.tx, transform.ty);
                ctx.drawImage(img, -w / 2, -h / 2, w, h);
                ctx.restore();

                // Рисуем измерения с canvas overlay
                if (measureCtx && measurements.length > 0) {
                    ctx.save();
                    ctx.drawImage(measureCanvas, 0, 0);
                    ctx.restore();
                }

                // Оверлей с метаданными (bottom-left)
                const overlayY = canvas.height - 60;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(10, overlayY, 350, 50);

                ctx.font = '11px monospace';
                ctx.fillStyle = '#0f0';

                const patientName = metadata.PatientName || 'Unknown';
                const studyDate = metadata.StudyDate || '';
                const modality = metadata.Modality || 'DICOM';
                const wl = Math.round(wlState.wc);
                const ww = Math.round(wlState.ww);
                const frameText = isMultiFrame ? ` | Frame ${currentFrame + 1}/${totalFrames}` : '';

                ctx.fillText(`${patientName} | ${studyDate} | ${modality}`, 20, overlayY + 18);
                ctx.fillText(`WL: ${wl} / WW: ${ww}${frameText} | ${img.naturalWidth}×${img.naturalHeight}`, 20, overlayY + 38);

                // Ориентация (top-right)
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(canvas.width - 100, 10, 90, 60);

                ctx.fillStyle = '#0f0';
                ctx.font = 'bold 12px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('A', canvas.width - 55, 25);
                ctx.fillText('P', canvas.width - 55, canvas.height > 300 ? canvas.height - 30 : 65);
                ctx.textAlign = 'left';
                ctx.fillText('R', canvas.width - 30, 40);
                ctx.fillText('L', canvas.width - 85, 40);

                // Скачиваем
                const fileName = generateScreenshotFileName();
                canvas.toBlob((blob) => {
                    if (!blob) {
                        statusTextSpan.textContent = 'Ошибка создания скриншота';
                        return;
                    }

                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => {
                        URL.revokeObjectURL(url);
                        document.body.removeChild(a);
                    }, 100);

                    statusTextSpan.textContent = `Скриншот сохранён: ${fileName}`;
                    setTimeout(() => {
                        if (statusTextSpan.textContent.startsWith('Скриншот')) {
                            statusTextSpan.textContent = 'Готово';
                        }
                    }, 3000);
                }, 'image/png');

            } catch (e) {
                console.error('Screenshot error:', e);
                statusTextSpan.textContent = 'Ошибка: ' + e.message;
            }
        }

        function generateScreenshotFileName() {
            const patient = (metadata.PatientName || 'Unknown').replace(/[^a-zA-Z0-9а-яА-Я_-]/g, '_').substring(0, 30);
            const date = metadata.StudyDate ? metadata.StudyDate.substring(0, 8) : 'nodate';
            const modality = metadata.Modality || 'DICOM';
            const frame = isMultiFrame ? `_fr${currentFrame + 1}` : '';
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-').substring(0, 19);

            return `${modality}_${patient}_${date}${frame}_${timestamp}.png`;
        }

        // ==================== СКАЧИВАНИЕ DICOM ====================
        async function downloadDicom() {
            try {
                statusTextSpan.textContent = 'Подготовка к скачиванию...';
                const response = await fetch(`/api/dicom/wado/${FILE_ID}?token=${TOKEN}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                
                // Формируем имя файла
                let fileName = 'dicom';
                if (metadata.StudyDescription) {
                    fileName = metadata.StudyDescription.replace(/[^a-zA-Z0-9а-яА-Я._-]/g, '_');
                } else if (metadata.PatientName) {
                    fileName = metadata.PatientName.replace(/[^a-zA-Z0-9а-яА-Я._-]/g, '_');
                } else {
                    fileName = `dicom_${FILE_ID}`;
                }
                a.download = `${fileName}.dcm`;
                
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    URL.revokeObjectURL(url);
                    document.body.removeChild(a);
                }, 100);
                
                statusTextSpan.textContent = 'Скачивание начато';
                setTimeout(() => {
                    if (statusTextSpan.textContent === 'Скачивание начато') {
                        statusTextSpan.textContent = 'Готово';
                    }
                }, 2000);
                
            } catch (e) {
                console.error('Download error:', e);
                statusTextSpan.textContent = 'Ошибка скачивания';
                alert('Ошибка при скачивании: ' + e.message);
            }
        }
        
        // ==================== УТИЛИТЫ ====================
        function showError(msg) {
            loadingDiv.style.display = 'none';
            document.getElementById('error').style.display = 'flex';
            document.getElementById('errorMsg').textContent = msg;
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }
        
        // Обработка сообщений от родительского окна
        window.addEventListener('message', (e) => {
            if (e.data === 'close-dicom-viewer') {
                window.parent.postMessage('dicom-close', '*');
            }
        });

        // ==================== ГОРЯЧИЕ КЛАВИШИ ====================
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            switch(e.key) {
                case 'w': case 'W':
                case 'ц': case 'Ц':  // русская раскладка
                    setTool('window');
                    break;
                case 'z': case 'Z':
                case 'я': case 'Я':
                    setTool('zoom');
                    break;
                case 'p': case 'P':
                case 'з': case 'З':
                    setTool('pan');
                    break;
                case 'c': case 'C':
                case 'с': case 'С':  // русская 'с' для Cine
                    if (isMultiFrame) setTool('cine');
                    break;
                case ' ':
                    e.preventDefault();
                    if (isMultiFrame) toggleCineLoop();
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    if (isMultiFrame) prevFrame();
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    if (isMultiFrame) nextFrame();
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    if (isMultiFrame) firstFrame();
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    if (isMultiFrame) lastFrame();
                    break;
                case 'r': case 'R':
                case 'к': case 'К':
                    resetView();
                    break;
                case 'i': case 'I':
                case 'ш': case 'Ш':
                    invertView();
                    break;
                case 'm': case 'M':
                case 'ь': case 'Ь':
                    toggleMeasurementMode();
                    break;
                case 's': case 'S':
                case 'ы': case 'Ы':
                    takeScreenshot();
                    break;
                case 'Escape':
                    if (measurementMode) toggleMeasurementMode();
                    break;
                case '1':
                    setPreset('Bone');
                    break;
                case '2':
                    setPreset('Lung');
                    break;
                case '3':
                    setPreset('Brain');
                    break;
                case '4':
                    setPreset('Abdomen');
                    break;
                case '5':
                    setPreset('Liver');
                    break;
            }
        });

        // Очистка при закрытии
        window.addEventListener('beforeunload', () => {
            // Останавливаем cine loop
            if (cineInterval) {
                clearInterval(cineInterval);
            }

            // Очищаем кэш фреймов и отменяем загрузки
            clearFrameCache();

            if (currentImageUrl && currentImageUrl.startsWith('blob:')) {
                URL.revokeObjectURL(currentImageUrl);
            }
        });
    </script>
</body>
</html>

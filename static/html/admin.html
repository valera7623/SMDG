<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="admin.title">SMDG — Admin panel</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/language-selector.css">
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <script src="/static/js/i18n.js" defer></script>
    <script type="module" src="/static/js/admin.js"></script>
</head>

<body>
    <div class="container">
        <header class="site-header" role="banner">
            <div class="site-header__top">
                <div class="site-header__left site-header__left--admin">
                    <h1 class="site-header__title">🔐 <span data-i18n="admin.title">SMDG Admin panel</span></h1>
                    <a href="/" class="back-link site-header__back">← <span data-i18n="admin.back_home">Back to home</span></a>
                </div>
                <div class="site-header__trailing">
                <div class="user-info user-info--header" id="userInfo">
                </div>
                <div id="smdgLangAndMenu" class="site-header__lang-menu" aria-label="Menu and language">
                <div class="theme-switch theme-switch--compact-header" role="group" aria-label="Theme">
                    <button type="button" class="theme-switch__btn" data-smdg-theme="light" aria-pressed="false">
                        <span class="theme-switch__glyph" aria-hidden="true">☀️</span>
                        <span class="theme-switch__text" data-i18n="theme.light">Light</span>
                    </button>
                    <button type="button" class="theme-switch__btn" data-smdg-theme="dark" aria-pressed="false">
                        <span class="theme-switch__glyph" aria-hidden="true">🌙</span>
                        <span class="theme-switch__text" data-i18n="theme.dark">Dark</span>
                    </button>
                </div>
                </div>
                </div>
            </div>
        </header>

        <section class="section">
            <h2>📁 <span data-i18n="admin.files_section">File management</span></h2>
            <div class="controls">
                <button onclick="loadFiles()" class="btn-secondary">🔄 <span data-i18n="admin.refresh_list">Refresh list</span></button>
                <button onclick="getCleanupStats()" class="btn-primary">🚮 <span data-i18n="admin.check_cleanup">Check cleanup</span></button>
            </div>
            <div id="fileList" class="file-list admin"></div>
            <div id="cleanupStats"></div>
        </section>

        <section id="admin-advanced-wrap" class="section">
            <h2>👥 <span data-i18n="admin.users_section">User management</span></h2>
            <div class="controls">
                <a href="/admin/users" class="btn-primary">📋 <span data-i18n="admin.go_to_users">Go to user management</span></a>
                <a href="/admin/dlq" class="btn-secondary">📬 DLQ management</a>
            </div>
            <p data-i18n="admin.users_description">View, create, edit and delete system users.</p>
        </section>

        <section class="section info">
            <h2>📊 <span data-i18n="admin.system_stats">System statistics</span></h2>
            <div id="statsInfo"></div>
        </section>

        <section id="admin-danger-wrap" class="section danger">
            <h2>⚠️ <span data-i18n="admin.danger_ops">Dangerous operations</span></h2>
            <div class="danger-zone">
                <p><strong data-i18n="admin.full_purge_label">Full system purge:</strong></p>
                <button onclick="purgeAllFiles()" class="btn-danger">🗑️ <span data-i18n="admin.delete_all_files">DELETE ALL FILES</span></button>
                <p class="warning-text">
                    <small data-i18n="admin.delete_all_warning">Removes all encrypted files. Requires double confirmation.</small>
                </p>
            </div>
        </section>
    </div>
    <script>
      (async function adminSimpleMode() {
        try {
          const r = await fetch('/health/deployment');
          if (!r.ok) return;
          const d = await r.json();
          if (d.simple_admin) {
            document.getElementById('admin-advanced-wrap')?.setAttribute('hidden', 'hidden');
            document.getElementById('admin-danger-wrap')?.setAttribute('hidden', 'hidden');
          }
        } catch (e) { /* offline */ }
      })();
    </script>
</body>

</html>

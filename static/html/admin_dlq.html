<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMDG - DLQ Management</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/admin-dlq.css">
    <link rel="stylesheet" href="/static/css/language-selector.css">
    <script src="/static/js/i18n.js" defer></script>
    <script type="module" src="/static/js/admin-dlq.js"></script>
</head>
<body>
    <div class="container">
        <header class="site-header" role="banner">
            <div class="site-header__top">
                <div class="header-content site-header__brand">
                    <h1>📬 Dead Letter Queue</h1>
                    <p><a href="/admin" class="back-link">← Back to admin panel</a></p>
                </div>
                <button type="button" class="hamburger" id="smdgMenuToggle" aria-label="Menu"
                    aria-controls="smdgMainNav" aria-expanded="false"><span></span><span></span><span></span></button>
            </div>
            <div id="smdgNavBackdrop" class="nav-backdrop" hidden aria-hidden="true"></div>
            <nav class="main-nav" id="smdgMainNav" aria-label="Admin navigation">
                <a href="/" class="main-nav__link btn-info">🏠 Home</a>
                <a href="/admin" class="main-nav__link btn-admin">⚙️ Admin</a>
                <a href="/admin/users" class="main-nav__link btn-primary">👥 Users</a>
            </nav>
        </header>

        <section class="section stats-section">
            <h2>📊 DLQ Stats</h2>
            <div id="statsGrid" class="stats-grid"></div>
        </section>

        <section class="section">
            <h2>🔎 Filters</h2>
            <div class="filter-controls">
                <input id="messageIdSearch" type="text" placeholder="Search by message_id">
                <select id="statusFilter">
                    <option value="">All statuses</option>
                    <option value="pending">pending</option>
                    <option value="processing">processing</option>
                    <option value="failed">failed</option>
                    <option value="resolved">resolved</option>
                </select>
                <select id="queueFilter">
                    <option value="">All queues</option>
                    <option value="webhook">webhook</option>
                    <option value="email">email</option>
                    <option value="cleanup">cleanup</option>
                    <option value="dicom">dicom</option>
                    <option value="audit">audit</option>
                </select>
                <select id="limitFilter">
                    <option value="10">10 / page</option>
                    <option value="25" selected>25 / page</option>
                    <option value="50">50 / page</option>
                    <option value="100">100 / page</option>
                </select>
                <button class="btn-primary" onclick="applyFilters()">Apply</button>
                <button class="btn-secondary" onclick="clearFilters()">Reset</button>
            </div>
            <p class="hint" id="autoRefreshInfo">Auto-refresh: every 10 seconds</p>
        </section>

        <section class="section">
            <h2>🧹 Maintenance</h2>
            <div class="maintenance-row">
                <input id="cleanupDays" type="number" min="1" max="3650" value="30">
                <button class="btn-warning" onclick="cleanupOld()">Cleanup old messages</button>
            </div>
            <p id="maintenanceResult" class="hint"></p>
        </section>

        <section class="section">
            <h2>📋 Messages</h2>
            <div class="table-container">
                <table class="dlq-table responsive-data-table">
                    <thead>
                        <tr>
                            <th>Message ID</th>
                            <th>Queue</th>
                            <th>Status</th>
                            <th>Retries</th>
                            <th>Error</th>
                            <th>Created</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="messagesTbody">
                        <tr>
                            <td colspan="7" class="loading">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="pagination-row">
                <button class="btn-secondary pagination-btn" onclick="prevPage()">← Prev</button>
                <span id="paginationInfo">Page 1</span>
                <button class="btn-secondary pagination-btn" onclick="nextPage()">Next →</button>
            </div>
        </section>

        <section class="section">
            <h2>📝 Message Details</h2>
            <pre id="detailsBox" class="json-viewer">{}</pre>
        </section>
    </div>
</body>
</html>

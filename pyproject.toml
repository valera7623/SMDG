[tool.poetry]
name = "smdg"
version = "1.0.0"
description = "Проект для шифрования и безопасной передачи файлов (Secure Medical Data Gateway)"
authors = ["Валерий <valera7623@gmail.com>"]  
license = "MIT"
readme = "README.md"
packages = [{include = "app"}]  

[tool.poetry.dependencies]
python = "^3.10"  

fastapi = "0.128.1"
uvicorn = "0.40.0"
starlette = "0.50.0"

sqlalchemy = {version = "2.0.46", extras = ["asyncio"]}
sqlmodel = "0.0.32"
asyncpg = "0.31.0"
alembic = "1.18.3"
psycopg2-binary = "2.9.11"

PyJWT = {version = "2.11.0", extras = ["crypto"]}
python-jose = {version = "3.5.0", extras = ["cryptography"]}
passlib = {version = "1.7.4", extras = ["bcrypt"]}
argon2-cffi = "25.1.0"

slowapi = "0.1.9"
limits = "5.8.0"

redis = "7.1.0"
aiohttp = "3.13.3"

python-multipart = "0.0.22"
python-magic = "0.4.27"
clamd = "1.0.2"
age = "0.5.1"

pydantic = "2.12.5"
pydantic-settings = "2.12.0"
pydantic-core = "2.41.5"          
python-dotenv = "1.2.1"
typer = "0.21.1"
psutil = "7.2.2"
apscheduler = "^3.10.4"
requests = "2.32.5"

# Тестирование / dev
pytest = "9.0.2"
pytest-asyncio = "1.3.0"
pytest-mock = "3.15.1"
pytest-cov = "7.0.0"
httpx = "0.28.1"
respx = "0.22.0"
coverage = "7.13.3"
asgi-lifespan = "2.1.0"
aiosqlite = "0.22.1"
nest-asyncio = "1.6.0"
pyotp = "^2.9.0"

[tool.poetry.group.dev.dependencies]
# если захочешь добавить dev-only инструменты позже
# black = "^24.8"
# ruff = "^0.6"
# mypy = "^1.11"

pyotp = "2.9.0"
qrcode = "7.4.2"
pillow = "10.4.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]

python_paths = "."
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
# =============================================================================
# Blackbox Exporter modules for SMDG
# =============================================================================
# Используется в prometheus.yml job "blackbox-http" для внешних probes.
# Пробуем /health/live (должен всегда отвечать 200) и /health/ready
# (должен отвечать 200 когда сервис готов).
# =============================================================================

modules:

  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]
      method: GET
      follow_redirects: true
      fail_if_ssl: false
      fail_if_not_ssl: false
      preferred_ip_protocol: "ip4"
      headers:
        User-Agent: "SMDG-Blackbox/1.0"

  http_2xx_ssl:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]
      method: GET
      fail_if_not_ssl: true
      preferred_ip_protocol: "ip4"

  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: "ip4"

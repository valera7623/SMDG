services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: smdg
      POSTGRES_USER: smdg_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smdg_user -d smdg"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - backend

  smdg:
    build: .
    ports:
      - "8000:8000"
    expose:
      - "8000"
    stop_grace_period: 60s
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    secrets:
      - age_private_key
      - admin_password
      - jwt_secret_key
      - postgres_password
    environment:
      DEV_MODE: "${DEV_MODE:-true}"
      DEPLOYMENT_TYPE: "${DEPLOYMENT_TYPE:-intl}"
      REDIS_URL: "redis://redis:6379/0"
      MAX_CONCURRENT_REQUESTS: "${MAX_CONCURRENT_REQUESTS:-100}"
      READINESS_CHECK_TIMEOUT: "${READINESS_CHECK_TIMEOUT:-2}"
      READINESS_CACHE_TTL: "${READINESS_CACHE_TTL:-1.5}"
      S3_ENABLED: "${S3_ENABLED:-true}"
      S3_ENDPOINT_URL: "${S3_ENDPOINT_URL:-http://minio:9000}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-minioadmin}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-minioadmin123}"
      S3_BUCKET_ENCRYPTED: "${S3_BUCKET_ENCRYPTED:-smdg-encrypted}"
      S3_BUCKET_UPLOADS: "${S3_BUCKET_UPLOADS:-smdg-uploads}"
      S3_BUCKET_DECRYPTED: "${S3_BUCKET_DECRYPTED:-smdg-decrypted}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_USE_SSL: "${S3_USE_SSL:-false}"
      OTEL_ENABLED: "${OTEL_ENABLED:-false}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-smdg}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}"
      OTEL_EXPORTER_OTLP_PROTOCOL: "${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}"
      OTEL_PROPAGATORS: "${OTEL_PROPAGATORS:-b3multi}"
      OTEL_TRACES_SAMPLER: "${OTEL_TRACES_SAMPLER:-parentbased_always_on}"
      OTEL_TRACES_SAMPLER_ARG: "${OTEL_TRACES_SAMPLER_ARG:-1.0}"
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      JAEGER_QUERY_URL: "${JAEGER_QUERY_URL:-http://jaeger:16686}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      TELEGRAM_ARCHIVE_CHAT_ID: "${TELEGRAM_ARCHIVE_CHAT_ID:-}"
      SMDG_DASHBOARD_URL: "${SMDG_DASHBOARD_URL:-http://localhost:3000}"
      SMDG_TRACING_URL: "${SMDG_TRACING_URL:-http://localhost:16686}"
      SMDG_LOGS_URL: "${SMDG_LOGS_URL:-}"
      SMDG_ALERT_WEBHOOK_SECRET: "${SMDG_ALERT_WEBHOOK_SECRET:-}"
    volumes:
      - ./migrations:/app/migrations
      - ./uploads:/app/uploads
      - ./encrypted:/app/encrypted
      - ./decrypted:/app/decrypted
      - ./static:/app/static
      - ./audit_logs:/app/audit_logs
      - ./app:/app/app:ro
      - smdg_keys:/app/keys
      - smdg_backups:/app/backups
      - smdg_archive:/app/archive
    dns:
      - 1.1.1.1
      - 8.8.8.8
      
    networks:
      - backend
    restart: unless-stopped



  nginx:
    image: nginx:alpine
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/upstream-target.conf:/etc/nginx/conf.d/upstream-target.conf
      - ./certs:/etc/nginx/certs:ro
      - ./static:/app/static:ro
    depends_on:
      - smdg
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    container_name: smdg-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin123}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  backups:
    image: alpine:latest
    container_name: smdg-backups
    restart: always
    volumes:
      - smdg_backups:/app/backups
      - ./encrypted:/app/encrypted:ro
    command: >
      sh -c '
        echo "Установка пакетов..."
        apk add --no-cache postgresql-client rsync dcron

        echo "Очищаем и добавляем задачи в crontab..."
        > /etc/crontabs/root

        {
          echo "0 3 * * * (pg_dump -h db -U smdg_user -d smdg | gzip > /app/backups/smdg_\$(date +%Y%m%d_%H%M).sql.gz 2>> /app/backups/backup_errors.log) && echo \"[\$(date '+%Y-%m-%d %H:%M:%S')] pg_dump OK\" >> /app/backups/backup.log || echo \"[\$(date '+%Y-%m-%d %H:%M:%S')] pg_dump FAILED\" >> /app/backups/backup.log"
          echo "15 3 * * * rsync -a --delete /app/encrypted/ /app/backups/encrypted/"
          echo "30 3 * * * find /app/backups -name \"*.sql.gz\" -mtime +30 -print -delete"
          echo "35 3 * * * find /app/backups/encrypted -mtime +30 -print -delete"
          echo "0 4 * * * df -h /app/backups >> /app/backups/backup_space.log"
        } >> /etc/crontabs/root

        echo "Содержимое crontab:"
        cat /etc/crontabs/root

        echo "Запуск cron..."
        crond -f -l 8
      '
    environment:
      - PGPASSWORD_FILE=/run/secrets/postgres_password
    depends_on:
      - db
    secrets:
      - postgres_password
    networks:
      - backend

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: smdg-prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./prometheus/sla-rules.yml:/etc/prometheus/sla-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - backend

  grafana:
    image: grafana/grafana:11.4.0
    container_name: smdg-grafana
    restart: always
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - backend

secrets:
  age_private_key:
    file: ./secrets/age.key
  admin_password:
    file: ./secrets/admin_password.txt
  jwt_secret_key:
    file: ./secrets/jwt_secret.txt
  postgres_password:
    file: ./secrets/postgres_password.txt

volumes:
  grafana_data:
  prometheus_data:
  pgdata:
  minio_data:
  smdg_encrypted:
  smdg_uploads:
  smdg_decrypted:
  smdg_keys:
  smdg_audit_logs:
  smdg_backups:
  smdg_archive:

networks:
  backend:
    driver: bridge
services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: smdg
      POSTGRES_USER: smdg_user
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smdg_user -d smdg"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
    networks:
      - backend

  smdg:
    build: .
    expose:
      - "8000"
    volumes:
      - ./uploads:/app/uploads
      - ./encrypted:/app/encrypted
      - ./decrypted:/app/decrypted
      - ./keys:/app/keys:ro
      - ./certs:/app/certs:ro
      - ./static:/app/static
      - ./audit_logs:/app/audit_logs
    environment:
      - DEV_MODE=true
      - DATABASE_URL=postgresql+asyncpg://smdg_user:password@db:5432/smdg
      - REDIS_URL=redis://redis:6379/0
      - ADMIN_PASSWORD=admin
      - POSTGRES_PASSWORD=password
    depends_on:
      - db
      - redis
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Временный простой healthcheck или без него
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/8000' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - smdg
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend

networks:
  backend:

volumes:
  pgdata:

# ────────────────────────────────────────────────────────────────
# Дополнительные комментарии и рекомендации
# ────────────────────────────────────────────────────────────────
#
# 1. Автоматизация миграций и админа:
#    Теперь всё происходит через entrypoint.sh в Dockerfile.
#    При каждом запуске контейнера smdg:
#      - alembic upgrade head
#      - python -m app.cli create_admin (с паролем из ADMIN_PASSWORD)
#      - запуск uvicorn
#
# 2. Как использовать ADMIN_PASSWORD:
#    - Можно менять в .env или прямо здесь
#    - Для безопасности в продакшене → docker secrets или .env вне репозитория
#
# 3. HTTPS:
#    - Сертификаты должны лежать в ./certs/localhost+2.pem и localhost+2-key.pem
#    - Сгенерированы через mkcert localhost 127.0.0.1 ::1
#
# 4. Рекомендации по продакшену:
#    - Заменить ADMIN_PASSWORD на переменную из secrets
#    - Использовать certbot + Let's Encrypt вместо self-signed
#    - Добавить depends_on: nginx в другие сервисы, если нужно
#    - Включить HSTS и CSP в nginx.conf
#
# 5. Запуск:
#    docker compose down
#    docker compose build
#    docker compose up -d
#
# Удачного деплоя!


services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: smdg
      POSTGRES_USER: smdg_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      
    secrets:
      - postgres_password
    
      
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smdg_user -d smdg"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: always
    # redis обычно не требует пароля в dev, но если нужен — аналогично
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
    networks:
      - backend

  smdg:
    build: .
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    secrets:
      - age_private_key
      - admin_password
      - jwt_secret_key          # если хочешь вынести
      - postgres_password       # если smdg тоже должен знать пароль БД
    environment:
      
      DEV_MODE: "${DEV_MODE:-true}"
      
      REDIS_URL: "redis://redis:6379/0"
      
    volumes:
      - ./uploads:/app/uploads
      - ./encrypted:/app/encrypted
      - ./decrypted:/app/decrypted
      - ./static:/app/static
      - ./audit_logs:/app/audit_logs
      - ./app:/app/app:ro
    networks:
      - backend



  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - smdg
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend

  

  clamav:
    image: clamav/clamav:latest
    restart: unless-stopped
    container_name: clamav
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
  
    healthcheck:
      test: ["CMD", "clamdscan", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - backend


   

secrets:
  age_private_key:
    file: ./secrets/age.key
  admin_password:
    file: ./secrets/admin_password.txt
  jwt_secret_key:
    file: ./secrets/jwt_secret.txt
  postgres_password:
    file: ./secrets/postgres_password.txt

volumes:
  pgdata:
  clamav_data:
networks:
  backend:


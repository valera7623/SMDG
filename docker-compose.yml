

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: smdg
      POSTGRES_USER: smdg_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      
    secrets:
      - postgres_password
    
      
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smdg_user -d smdg"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - backend

  smdg:
    build: .
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    secrets:
      - age_private_key
      - admin_password
      - jwt_secret_key          # если хочешь вынести
      - postgres_password       # если smdg тоже должен знать пароль БД
    environment:
      
      DEV_MODE: "${DEV_MODE:-true}"
      
      REDIS_URL: "redis://redis:6379/0"
      
    volumes:
      - ./uploads:/app/uploads
      - ./encrypted:/app/encrypted
      - ./decrypted:/app/decrypted
      - ./static:/app/static
      - ./audit_logs:/app/audit_logs
      - ./app:/app/app:ro
      - smdg_keys:/app/keys
      - smdg_backups:/app/backups
    networks:
      - backend
    restart: unless-stopped



  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./static:/app/static:ro
    depends_on:
      - smdg
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend

  

  clamav:
    image: clamav/clamav:latest
    restart: unless-stopped
    container_name: clamav
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav   # ← persistent базы сигнатур
    command: >
      sh -c "
        echo 'Starting freshclam daemon...' &&
        freshclam --daemon --checks=24 &&
        echo 'Starting clamd...' &&
        exec clamd --foreground
      "
    healthcheck:
      test: ["CMD", "clamdscan", "--version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s   
    networks:
      - backend



  backups:
    image: alpine:latest
    container_name: smdg-backups
    restart: always
    volumes:
      - smdg_backups:/app/backups
      - ./encrypted:/app/encrypted:ro
      # - ./backups:/app/backups/host
    command: >
      sh -c '
        echo "Установка пакетов..."
        apk add --no-cache postgresql-client rsync dcron

        echo "Очищаем и добавляем задачи в crontab..."
        > /etc/crontabs/root

        {
          echo "0 3 * * * (pg_dump -h db -U smdg_user -d smdg | gzip > /app/backups/smdg_\$(date +%Y%m%d_%H%M).sql.gz 2>> /app/backups/backup_errors.log) && echo \"[\$(date '+%Y-%m-%d %H:%M:%S')] pg_dump OK\" >> /app/backups/backup.log || echo \"[\$(date '+%Y-%m-%d %H:%M:%S')] pg_dump FAILED\" >> /app/backups/backup.log"
          echo "15 3 * * * rsync -a --delete /app/encrypted/ /app/backups/encrypted/"
          echo "30 3 * * * find /app/backups -name \"*.sql.gz\" -mtime +30 -print -delete"
          echo "35 3 * * * find /app/backups/encrypted -mtime +30 -print -delete"
          echo "0 4 * * * df -h /app/backups >> /app/backups/backup_space.log"
        } >> /etc/crontabs/root

        echo "Содержимое crontab:"
        cat /etc/crontabs/root

        echo "Запуск cron..."
        crond -f -l 8
      '
    environment:
      - PGPASSWORD_FILE=/run/secrets/postgres_password
    depends_on:
      - db
    secrets:
      - postgres_password   
    networks:
      - backend

 
   

secrets:
  age_private_key:
    file: ./secrets/age.key
  admin_password:
    file: ./secrets/admin_password.txt
  jwt_secret_key:
    file: ./secrets/jwt_secret.txt
  postgres_password:
    file: ./secrets/postgres_password.txt

volumes:
  pgdata:
  clamav_data:
  smdg_encrypted:
  smdg_uploads:
  smdg_decrypted:
  smdg_keys:
  smdg_audit_logs:
  smdg_backups:
networks:
  backend:


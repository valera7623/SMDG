# =============================================================================
# docker-compose.prod.yml — Production overrides (Zero-downtime deploy)
#
# Использование:
#   # Обычный старт:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
#   # Zero-downtime deploy:
#   ./scripts/zero_downtime_deploy.sh
#
#   # Docker Swarm (несколько серверов):
#   docker stack deploy -c docker-compose.yml -c docker-compose.prod.yml smdg
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # База данных — усиленные ограничения в prod
  # ---------------------------------------------------------------------------
  db:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
        reservations:
          memory: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Redis — добавляем пароль и ограничения
  # Используется и для сессий/rate-limit → сохраняется при смене контейнеров
  # ---------------------------------------------------------------------------
  redis:
    restart: always
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD}"
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
      --appendfsync everysec
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # One-shot миграции (запускаются ДО старта smdg-реплик).
  # Гарантируют, что миграции выполнит ровно один контейнер, даже при rolling
  # update (второй/третий smdg-инстанс уже найдёт схему готовой).
  #
  # Миграции должны быть обратно совместимыми — см.
  # scripts/run_migrations_zero_downtime.py
  # ---------------------------------------------------------------------------
  migrations:
    image: "${DOCKER_USERNAME}/smdg:${IMAGE_TAG:-latest}"
    restart: "no"
    entrypoint: ["python", "/app/scripts/run_migrations_zero_downtime.py"]
    command: []
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - source: postgres_password
        target: postgres_password
        uid: "10001"
        gid: "10001"
        mode: 0440
    environment:
      DEV_MODE: "false"
      LOG_LEVEL: "INFO"
      # Формируется в entrypoint, но здесь дублируем для одноразового таска
      PGPASSWORD_FILE: /run/secrets/postgres_password
      ALEMBIC_CONFIG: "/app/alembic.ini"
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 1
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ---------------------------------------------------------------------------
  # Основное приложение — ROLLING UPDATE
  #
  # Ключевые настройки:
  #   replicas: 2               — всегда минимум 2 инстанса (нет SPOF)
  #   order: start-first        — сначала стартует НОВЫЙ контейнер, потом
  #                               останавливается старый (0 секунд downtime)
  #   parallelism: 1            — обновляем по одному, а не все сразу
  #   delay: 10s                — пауза между заменами (нагрузка разгружается)
  #   failure_action: rollback  — при неудачном health check — откат
  #   monitor: 60s              — окно мониторинга после обновления каждого
  #                               контейнера (если упал — считаем неудачей)
  # ---------------------------------------------------------------------------
  smdg:
    # В prod используем собранный образ из Docker Hub (не build: .)
    image: "${DOCKER_USERNAME}/smdg:${IMAGE_TAG:-latest}"
    build: !reset null
    restart: always

    # Graceful shutdown: уже есть в базе (60s). Подтверждаем здесь.
    stop_grace_period: 60s
    stop_signal: SIGTERM

    # Docker HEALTHCHECK использует /health/live (перезапуск зависших
    # контейнеров). Readiness для переключения трафика проверяется nginx.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s

    # Миграции должны выполниться ДО старта smdg.
    depends_on:
      migrations:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy

    ports: !reset []
    expose:
      - "8000"

    environment:
      DEV_MODE: "false"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      LOG_LEVEL: "WARNING"

      # В проде БЕЗ alembic upgrade внутри entrypoint: миграции — отдельный сервис.
      SKIP_MIGRATIONS_IN_ENTRYPOINT: "true"

      # Идентификатор версии для /metrics и деплой-алертов
      SMDG_VERSION: "${IMAGE_TAG:-latest}"
      SMDG_GIT_SHA: "${GIT_SHA:-unknown}"

      # Readiness / Liveness
      MAX_CONCURRENT_REQUESTS: "${MAX_CONCURRENT_REQUESTS:-100}"
      READINESS_CHECK_TIMEOUT: "${READINESS_CHECK_TIMEOUT:-2}"
      READINESS_CACHE_TTL: "${READINESS_CACHE_TTL:-1.5}"

      # S3 / MinIO Configuration (в prod можно использовать внешний S3)
      S3_ENABLED: "${S3_ENABLED:-false}"
      S3_ENDPOINT_URL: "${S3_ENDPOINT_URL:-}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-}"
      S3_BUCKET_ENCRYPTED: "${S3_BUCKET_ENCRYPTED:-smdg-encrypted}"
      S3_BUCKET_UPLOADS: "${S3_BUCKET_UPLOADS:-smdg-uploads}"
      S3_BUCKET_DECRYPTED: "${S3_BUCKET_DECRYPTED:-smdg-decrypted}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_USE_SSL: "${S3_USE_SSL:-true}"

      # Distributed tracing (OpenTelemetry → Jaeger via otel-collector).
      # Все значения отключают tracing по умолчанию, чтобы production-деплой
      # без стека observability запускался без ошибок. Чтобы включить, поднимите
      # docker-compose.observability.yml и задайте OTEL_ENABLED=true в .env.
      OTEL_ENABLED: "${OTEL_ENABLED:-false}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-smdg}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}"
      OTEL_PROPAGATORS: "${OTEL_PROPAGATORS:-b3multi}"
      OTEL_TRACES_SAMPLER: "${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}"
      OTEL_TRACES_SAMPLER_ARG: "${OTEL_TRACES_SAMPLER_ARG:-0.1}"
      ENVIRONMENT: "${ENVIRONMENT:-production}"
      # NB: в prod Jaeger запускается с QUERY_BASE_PATH=/jaeger (UI под
      # /jaeger/ через nginx с Basic Auth), поэтому базовый URL для
      # внутренних API-запросов из app/api/tracing.py и check_tracing
      # тоже должен включать ``/jaeger``.
      JAEGER_QUERY_URL: "${JAEGER_QUERY_URL:-http://jaeger:16686/jaeger}"

    volumes:
      # В prod НЕ монтируем исходники (./app) — образ уже содержит код.
      # Файлы хранятся в S3 (stateless-контейнер) либо в shared volume.
      - smdg_uploads:/app/uploads
      - smdg_encrypted:/app/encrypted
      - smdg_decrypted:/app/decrypted
      - ./static:/app/static:ro
      - smdg_audit_logs:/app/audit_logs
      - smdg_keys:/app/keys
      - smdg_backups:/app/backups

    deploy:
      # 2 реплики = zero-downtime даже при рестарте
      replicas: 2
      endpoint_mode: vip
      update_config:
        parallelism: 1          # Обновлять по одному контейнеру
        delay: 10s              # Ждать 10с между обновлениями реплик
        order: start-first      # Сначала запустить новый, потом остановить старый
        failure_action: rollback
        monitor: 60s            # Следим 60с после обновления
        max_failure_ratio: 0.0  # Любая неудача → rollback
      rollback_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: pause
        monitor: 30s
      # NB: condition должен быть on-failure, т.к. max_attempts
      # несовместим с "any" на уровне Docker Engine
      # ("maximum retry count can only be used with 'on-failure'").
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
        reservations:
          memory: 256m
      # placement.max_replicas_per_node — swarm-only. В standalone compose
      # Docker Engine его не поддерживает и ругается при scale > 1.
      # Раскомментируйте при переходе на Docker Swarm.
      # placement:
      #   max_replicas_per_node: 1
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Nginx — load balancer с upstream health checks и graceful reload
  # ---------------------------------------------------------------------------
  nginx:
    restart: always
    # Подменяем конфиг на zero-downtime вариант с upstream
    volumes:
      - ./nginx/nginx-zero-downtime.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./static:/app/static:ro
      # Basic Auth для /jaeger/ и /prometheus/ — read-only.
      # Создание учёток (скрипт сам выберет bcrypt через локальный htpasswd
      # или httpd-контейнер):
      #   bash scripts/generate-htpasswd.sh jaeger     <username>
      #   bash scripts/generate-htpasswd.sh prometheus <username>
      # Файлы хранятся в secrets/ (уже в .gitignore).
      - ./secrets/.htpasswd-jaeger:/etc/nginx/.htpasswd-jaeger:ro
      - ./secrets/.htpasswd-prometheus:/etc/nginx/.htpasswd-prometheus:ro
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # ClamAV — убираем внешний порт, ограничиваем память
  # ---------------------------------------------------------------------------
  clamav:
    ports: !reset []
    expose:
      - "3310"
    restart: always
    deploy:
      resources:
        limits:
          memory: 1500m
          cpus: "1.0"
        reservations:
          memory: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Бэкапы — исправляем PGPASSWORD + добавляем ограничения
  # ---------------------------------------------------------------------------
  backups:
    restart: always
    command: >
      sh -c '
        echo "Установка пакетов..."
        apk add --no-cache postgresql-client rsync dcron

        echo "Читаем пароль БД из Docker secret..."
        export PGPASSWORD=$(cat /run/secrets/postgres_password)

        echo "Очищаем и добавляем задачи в crontab..."
        > /etc/crontabs/root

        {
          echo "0 3 * * * (pg_dump -h db -U smdg_user -d smdg | gzip > /app/backups/smdg_\$(date +%Y%m%d_%H%M).sql.gz 2>> /app/backups/backup_errors.log) && echo \"[\$(date +\"+%Y-%m-%d %H:%M:%S\")] pg_dump OK\" >> /app/backups/backup.log || echo \"[\$(date +\"+%Y-%m-%d %H:%M:%S\")] pg_dump FAILED\" >> /app/backups/backup.log"
          echo "15 3 * * * rsync -a --delete /app/encrypted/ /app/backups/encrypted/"
          echo "30 3 * * * find /app/backups -name \"*.sql.gz\" -mtime +30 -print -delete"
          echo "35 3 * * * find /app/backups/encrypted -mtime +30 -print -delete"
          echo "0 4 * * * df -h /app/backups >> /app/backups/backup_space.log"
        } >> /etc/crontabs/root

        echo "Запуск cron..."
        crond -f -l 8
      '
    environment:
      PGPASSWORD_FILE: null
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Prometheus — убираем внешний порт (доступ только через Nginx + Basic Auth)
  # ---------------------------------------------------------------------------
  prometheus:
    ports: !reset []
    expose:
      - "9090"
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.external-url=/prometheus/'
      - '--web.route-prefix=/'
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Grafana — закрываем анонимный доступ, пароль из secret
  # ---------------------------------------------------------------------------
  grafana:
    ports: !reset []
    expose:
      - "3000"
    restart: always
    secrets:
      - grafana_password
    environment:
      GF_SECURITY_ADMIN_PASSWORD: null
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "true"
      GF_SERVER_ROOT_URL: "https://${DOMAIN}/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_LOG_LEVEL: "warn"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# =============================================================================
# Добавляем секрет для Grafana
# =============================================================================
secrets:
  age_private_key:
    file: ./secrets/age.key
  admin_password:
    file: ./secrets/admin_password.txt
  jwt_secret_key:
    file: ./secrets/jwt_secret.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  grafana_password:
    file: ./secrets/grafana_password.txt
